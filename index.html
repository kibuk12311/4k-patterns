 rhythms at once, for example 4 against 3."}},{"term":{"ru":"Переходная нота","en":"Linking note"},"means":{"ru":"Одиночная нота между двумя аккордами, чтобы они не дали джек.","en":"A single note between two chords so they don't form a jack."}},{"term":{"ru":"Снап","en":"Snap"},"means":{"ru":"На сколько частей делится доля: 1/4, 1/3, 1/6, 1/8. Чем мельче снап, тем ближе ноты.","en":"How many parts a beat is split into: 1/4, 1/3, 1/6, 1/8. The finer the snap, the closer the notes."}},{"term":{"ru":"BPM","en":"BPM"},"means":{"ru":"Темп песни: сколько долей в минуту.","en":"The tempo of the song: how many beats per minute."}},{"term":{"ru":"Рейт","en":"Rate"},"means":{"ru":"Скорость карты целиком, например 0.8x или 1.2x. Пониженный рейт помогает разобрать трудное место.","en":"The speed of the whole map, for example 0.8x or 1.2x. A lower rate helps you work out a hard section."}},{"term":{"ru":"Акка (точность)","en":"Accuracy (acc)"},"means":{"ru":"Процент того, насколько точно ты попадаешь в ноты по времени.","en":"A percentage of how precisely you hit the notes in time."}},{"term":{"ru":"Манип","en":"Manip"},"means":{"ru":"Когда ноты жмут не так, как они стоят: ролл склеивают в джампы, аккорд раскатывают по одной ноте, чордджек долбят всей рукой. Счёт может быть хорошим, но паттерн ты играешь другой.","en":"Pressing notes differently from how they are written: a roll glued into jumps, a chord rolled out one note at a time, a chordjack mashed with the whole hand. The score can look good, but you are playing a different pattern."}},{"term":{"ru":"MSD","en":"MSD"},"means":{"ru":"Число сложности карты от калькулятора MinaCalc.","en":"A map's difficulty number from the MinaCalc calculator."}},{"term":{"ru":"MinaCalc","en":"MinaCalc"},"means":{"ru":"Калькулятор сложности из Etterna. Он делит сложность на семь скиллсетов.","en":"The difficulty calculator from Etterna. It splits difficulty into seven skillsets."}},{"term":{"ru":"Скиллсет","en":"Skillset"},"means":{"ru":"Вид навыка, по которому MinaCalc оценивает карту: Stream, Jumpstream, Handstream, Stamina, JackSpeed, Chordjack, Technical.","en":"A kind of skill MinaCalc rates a map on: Stream, Jumpstream, Handstream, Stamina, JackSpeed, Chordjack, Technical."}},{"term":{"ru":"Дан","en":"Dan"},"means":{"ru":"Курс из нескольких карт подряд, как экзамен. Каждый следующий дан сложнее.","en":"A course of several maps in a row, like an exam. Each dan is harder than the last."}},{"term":{"ru":"Чордстрим","en":"Chordstream"},"means":{"ru":"Общее название джампстрима и хендстрима: стрим с аккордами.","en":"An umbrella word for jumpstream and handstream: a stream with chords."}}],"path":{"ru":["Простой стрим на невысоком BPM: учишься читать {{снизу вверх|сверху вниз}} и держать пальцы на клавишах.","Триллы и роллы: это базовые движения пальцев внутри любого стрима.","Джампы и джампстрим: самое частое в rice, на нём держится большинство карт.","Миниджеки и короткие джеки: учишься жать одну клавишу два раза подряд.","Анкоры и хендстрим: больше нот на одну руку, больше нагрузка на один палец.","Чордджек и лонгджеки: тяжёлые аккорды и джеки, работают запястья.","Тех, грейсы и полиритм: когда чтение уверенное и хочется разных ритмов.","Стамина — понемногу на каждом шаге: карты постепенно длиннее, с отдыхом."],"en":["Simple stream at a low BPM: you learn to read from the {{bottom up|top down}} and keep your fingers on the keys.","Trills and rolls: the basic finger moves inside any stream.","Jumps and jumpstream: the most common thing in rice, and most maps are built on it.","Minijacks and short jacks: you learn to press one key twice in a row.","Anchors and handstream: more notes per hand, more load on a single finger.","Chordjack and longjacks: heavy chords and jacks, where the wrists do the work.","Tech, grace notes and polyrhythm: once your reading is solid and you want varied rhythms.","Stamina, a little at every step: gradually longer maps, with rest."]},"families":[{"id":"stream","about":{"ru":"Одиночные ноты потоком, без аккордов, и одна колонка не идёт два раза подряд. С него начинают почти все, и из него растут остальные семейства.","en":"Single notes in a flow, with no chords, and no column comes twice in a row. Almost everyone starts here, and the other families grow out of it."},"hands":{"ru":"Руки работают по очереди, каждая нота — один палец. Пальцы почти всё время лежат на клавишах и только нажимают.","en":"The hands take turns, and each note is one finger. The fingers rest on the keys almost all the time and just press."},"skill":["Stream"],"tips":{"ru":"Начни с невысокого BPM и следи, чтобы ноты шли ровно. Не торопись: в стриме легко начать жать быстрее музыки.","en":"Start at a low BPM and keep the notes even. Don't rush: in stream it's easy to start pressing ahead of the music."}},{"id":"jumpstream","about":{"ru":"Стрим, в который вставлены джампы, две ноты вместе. Хендов нет. Это самое частое семейство в rice.","en":"A stream with jumps, two notes together, mixed in. No hands. It's the most common family in rice."},"hands":{"ru":"Джамп берёт два пальца сразу: оба пальца одной руки или по пальцу с каждой. Между джампами руки снова играют стрим по очереди.","en":"A jump takes two fingers at once: both fingers of one hand or one from each hand. Between the jumps the hands go back to taking turns."},"skill":["Jumpstream"],"tips":{"ru":"Держи ритм по джампам: обычно они стоят на сильных долях музыки. Не дави джампы сильнее одиночных нот.","en":"Keep time by the jumps: they usually sit on the strong beats of the music. Don't press jumps harder than single notes."}},{"id":"handstream","about":{"ru":"Стрим с хендами, аккордами из трёх нот, плюс джампы и одиночные ноты. Плотнее и тяжелее джампстрима.","en":"A stream with hands, three-note chords, plus jumps and single notes. Denser and heavier than jumpstream."},"hands":{"ru":"В хенде одна рука жмёт обе свои клавиши, а другая одну. Потом руки быстро переходят к следующим нотам.","en":"In a hand, one hand presses both of its keys and the other presses one. Then the hands move quickly on to the next notes."},"skill":["Handstream"],"tips":{"ru":"Сначала научись уверенно играть джампстрим. Смотри на форму хенда целиком, а не на каждую ноту отдельно.","en":"Get confident with jumpstream first. Look at the shape of each hand as a whole, not at every note on its own."}},{"id":"chordjack","about":{"ru":"Аккорды подряд, и в каждом новом повторяется хотя бы одна колонка из прошлого. Так внутри аккордов получаются джеки.","en":"Chords in a row, and each new one repeats at least one column of the last. That puts jacks inside the chords."},"hands":{"ru":"Руки работают больше от запястья, чем от пальцев: часть пальцев повторяет нажатие, часть меняется.","en":"The hands work more from the wrist than from the fingers: some fingers repeat their press while others change."},"skill":["Chordjack"],"tips":{"ru":"Начинай с медленного чордджека. Полностью отпускай клавиши между аккордами, иначе ноты не засчитаются.","en":"Start with slow chordjack. Let go of the keys fully between chords, or the notes won't count."}},{"id":"jack","about":{"ru":"Одна колонка или аккорд несколько раз подряд. Скорость тут упирается в то, как быстро палец успевает отпустить клавишу и нажать снова.","en":"One column or chord several times in a row. Speed here comes down to how fast a finger can let go of the key and press it again."},"hands":{"ru":"Работает один и тот же палец, а помогает ему запястье. Остальные пальцы в это время могут играть что-то своё.","en":"The same finger does the work, with the wrist helping it. The other fingers can play something of their own meanwhile."},"skill":["JackSpeed"],"tips":{"ru":"Не бей клавишу изо всех сил, лёгкое нажатие быстрее. Длинные джеки тренируй короткими подходами с отдыхом.","en":"Don't slam the key, a light press is faster. Train long jacks in short sets with rest."}},{"id":"tech","about":{"ru":"Неровный ритм, смешанные снапы (1/3, 1/6, 1/8) и руки, которые делают разное. Такую карту трудно прочитать с ходу.","en":"Uneven rhythm, mixed snaps (1/3, 1/6, 1/8) and hands doing different things. A map like this is hard to read at sight."},"hands":{"ru":"Руки часто играют каждая свою линию, и их ритмы не совпадают. Нужно следить за обеими сразу.","en":"Each hand often plays its own line, and their rhythms don't match. You have to follow both at once."},"skill":["Technical"],"tips":{"ru":"Слушай музыку: ноты почти всегда идут за звуками. Трудные места разбирай на пониженном рейте.","en":"Listen to the music: the notes almost always follow the sounds. Work out hard sections at a lower rate."}},{"id":"extra","about":{"ru":"То, что не укладывается в одну семью: украшения ритма, рисунки на стыке семей и свойства карты. Бёрст — короткая плотная пачка, стамина — длина.","en":"Things that don't fit one family: rhythm ornaments, shapes between families and qualities of a map. A burst is a short dense pack, stamina is about length."}}],"manip":{"title":{"ru":"Манип: когда играешь не то, что написано","en":"Manip: playing something other than what's written"},"lede":{"ru":"Манип (от слова «манипуляция») в узком смысле — это когда ноты одной руки, которые идут по очереди, ты жмёшь разом, как аккорд. Так чаще всего склеивают триллы и стримы. Счёт при этом может быть неплохим, но навык под ним другой. Здесь разберём, как манип выглядит, почему он появляется и что с ним делать.","en":"Manip (short for \"manipulation\"), in the narrow sense, is when notes on one hand that come one after another get pressed at once, like a chord. Trills and streams are what gets glued together most. The score can still look fine, but the skill under it is a different one. Here's what manip looks like, why it happens and what to do about it."},"sections":[{"id":"what","title":{"ru":"Что такое манип","en":"What manip is"},"body":{"ru":["Каждая нота оценивается по своему времени. Если две ноты одной руки стоят очень близко, их можно нажать <b>вместе<\/b>, и обе всё равно попадут в окно оценки.","Так трилл или стрим превращается в джампы. Это и есть манип в узком смысле: ноты не вместе, а ты играешь их так, будто они вместе.","Ты не нарушаешь правила игры. Ты просто играешь другой паттерн, чем написан."],"en":["Every note is judged by its own timing. If two notes on one hand sit very close, you can press them <b>together<\/b> and both still land inside the judgement window.","That's how a trill or a stream turns into jumps. This is manip in the narrow sense: the notes aren't together, but you play them as if they were.","You're not breaking any rule of the game. You're just playing a different pattern from the one written."]},"examples":[{"name":{"ru":"Ролл как джампы","en":"Roll played as jumps"},"written":{"rows":"1 2 3 4 1 2 3 4"},"played":{"rows":"12 34 12 34","t":[0,2,4,6]},"note":{"ru":"Каждые две ноты на одной руке жмутся одним движением, как джамп. Выходит джамптрилл вдвое реже.","en":"Every two notes on one hand get pressed in one motion, like a jump. You end up with a jumptrill at half the density."}},{"name":{"ru":"Однорукий трилл как джампы","en":"One-hand trill played as jumps"},"written":{"rows":"1 2 1 2 3 4 3 4"},"played":{"rows":"12 12 34 34","t":[0,2,4,6],"jacks":true},"note":{"ru":"Вместо чередования пальцев ты жмёшь оба разом на каждые две ноты. Выходит медленный джампджек вместо трилла.","en":"Instead of alternating fingers, you press both at once for every two notes. You end up playing a slow jumpjack instead of a trill."}}]},{"id":"wide","title":{"ru":"В широком смысле","en":"In the wider sense"},"body":{"ru":["Словом «манип» часто зовут и любую игру не по нотам. Например, когда аккорд, который надо нажать разом, ты <b>раскатываешь<\/b> по одной ноте, или когда джамптрилл выходит роллом.","Сюда же относят мэш: в плотных аккордах ты жмёшь больше клавиш, чем надо, или склеиваешь соседние ноты в одно нажатие.","Вот несколько таких случаев."],"en":["People also often use the word \"manip\" for any playing that doesn't follow the notes. For example, when a chord meant to be hit at once gets <b>rolled<\/b> out one note at a time, or a jumptrill comes out as a roll.","Mashing goes here too: in dense chords you hit more keys than needed, or glue neighbouring notes into one press.","Here are a few of those cases."]},"examples":[{"name":{"ru":"Джамптрилл как ролл","en":"Jumptrill played as a roll"},"written":{"rows":"12 34 12 34"},"played":{"rows":"1 2 3 4 1 2 3 4","t":[0,0.35,1,1.35,2,2.35,3,3.35]},"note":{"ru":"Вместо ровных джампов рука перекатывается, и одна нота каждого джампа выходит чуть раньше другой.","en":"Instead of flat jumps the hand rolls, so one note of every jump lands a little before the other."}},{"name":{"ru":"Сплит-трилл как ролл","en":"Split trill played as a roll"},"written":{"rows":"13 24 13 24"},"played":{"rows":"1 3 2 4 1 3 2 4","t":[0,0.35,1,1.35,2,2.35,3,3.35]},"note":{"ru":"Руки перестают попадать вместе: одна всегда опускается чуть раньше. Каждый джамп на две руки рассыпается на две ноты.","en":"The hands stop landing together: one always comes down a bit earlier. Every two-hand jump falls apart into two notes."}},{"name":{"ru":"Чордджек всей рукой","en":"Mashing a chordjack"},"written":{"rows":"123 234 12 124","jacks":true},"played":{"rows":"1234 1234 1234 1234","jacks":true},"note":{"ru":"Ты бьёшь все четыре клавиши на каждый аккорд. Если следующая нота в пустой колонке уже близко, лишнее нажатие может засчитать её слишком рано.","en":"You hit all four keys on every chord. If the next note in an empty column is already close, the extra press can judge it too early."}},{"name":{"ru":"Смазанные аккорды в хендстриме","en":"Chord smashing in handstream"},"written":{"rows":"124 3 12 4 23 1 34 2"},"played":{"rows":"1234 124 123 234","t":[0,2,4,6],"jacks":true},"note":{"ru":"Одиночная нота после аккорда жмётся вместе с ним. Хендстрим превращается в редкие квады и хенды.","en":"The single note after a chord gets pressed together with it. The handstream turns into a few quads and hands."}}]},{"id":"why","title":{"ru":"Почему так выходит","en":"Why it happens"},"body":{"ru":["<b>Скорость.<\/b> Когда ноты идут быстрее, чем пальцы успевают по отдельности, рука сама начинает их склеивать.","<b>Окно оценки.<\/b> Если две ноты стоят в 30 мс друг от друга и ты жмёшь обе посередине, каждая выходит всего на 15 мс мимо. Часто это всё ещё хорошая оценка, поэтому привычка не наказывается сразу.","<b>Аккорды.<\/b> Ноты, которые стоят вместе, легко жать вместе и с соседями. В плотных паттернах с аккордами склеить ноты проще всего.","Обычно это не решение, а привычка. Ты можешь даже не замечать, что делаешь это."],"en":["<b>Speed.<\/b> When notes come faster than your fingers can manage one by one, your hand starts gluing them together on its own.","<b>Judgement windows.<\/b> If two notes are 30 ms apart and you hit both in the middle, each is only 15 ms off. That's often still a good judgement, so the habit doesn't get punished right away.","<b>Chords.<\/b> Notes that sit together are easy to press together with their neighbours too. Dense patterns with chords are the easiest to glue together.","Usually it's a habit, not a choice. You may not even notice you're doing it."]},"examples":[]},{"id":"cost","title":{"ru":"Чем он мешает","en":"What it costs you"},"body":{"ru":["<b>Он прячет настоящий навык.<\/b> Счёт на карте хороший, но ты прошёл не роллы, а джампы. На следующей карте с теми же роллами это может не помочь.","<b>Он ломается.<\/b> Чуть другой рейт или другая расстановка нот, и зазор уже слишком большой, чтобы жать вместе. Привычка сразу стоит точности.","<b>Он путает картину.<\/b> На одних паттернах манип проходит почти без потерь, на других точность резко падает. Из-за этого трудно понять, что у тебя получается на самом деле.","В Etterna игроки сделали отдельные инструменты, которые находят и подсвечивают манип в реплеях: ManipFactor и Manip Counter."],"en":["<b>It hides your real skill.<\/b> The score looks good, but you cleared jumps, not rolls. On the next map with the same rolls it may not help.","<b>It breaks.<\/b> A slightly different rate or a different note layout, and the gap is too wide to press together. The habit costs you accuracy right away.","<b>It muddies the picture.<\/b> On some patterns manip gets through with almost no loss, on others accuracy drops hard. That makes it hard to tell what you can really play.","In Etterna, players have built separate tools that find and highlight manip in replays: ManipFactor and Manip Counter."]},"examples":[]},{"id":"notice","title":{"ru":"Как заметить у себя","en":"How to spot it in yourself"},"body":{"ru":["Это практические советы, а не правила. Они часто помогают, но не всегда.","<b>Смотри на hit error.<\/b> Это полоска попаданий: она показывает, рано ты жмёшь или поздно. Если на одном паттерне попадания разъезжаются в две кучки, одна рано и одна поздно, ноты, похоже, склеены.","<b>Ищи колонку, которая всегда рано.<\/b> Если одна и та же нота на руке каждый раз попадает раньше, рука, похоже, жмёт её вместе со следующей.","<b>Сыграй на рейте пониже<\/b>, например 0.8x. Зазоры станут больше, и склеенные ноты дадут заметно худшие оценки.","<b>Запиши себя.<\/b> Видео рук или реплей на медленной скорости покажут, жмёшь ты по очереди или разом."],"en":["These are practical tips, not rules. They often help, but not always.","<b>Look at the hit error.<\/b> It's the bar that shows whether you hit early or late. If on one pattern your hits split into two clumps, one early and one late, the notes are probably glued together.","<b>Look for the column that's always early.<\/b> If the same note on a hand keeps landing early, your hand is probably pressing it together with the next one.","<b>Play at a lower rate<\/b>, for example 0.8x. The gaps get bigger, and glued notes get clearly worse judgements.","<b>Record yourself.<\/b> A video of your hands or a replay at slow speed shows whether you press one by one or all at once."]},"examples":[]},{"id":"fix","title":{"ru":"Как отучиться","en":"How to train it away"},"body":{"ru":["<b>Сбавь рейт.<\/b> Найди скорость, на которой каждая нота попадает ровно и отдельно. С неё и начинай.","<b>Поднимай медленно.<\/b> Добавляй по 0.05 рейта. Как только ноты снова начинают слипаться, вернись на шаг назад.","<b>Тренируй сам паттерн.<\/b> Открой карточку паттерна, который ты склеиваешь, и играй карты, где его много: роллы, триллы, сплит-триллы.","<b>Не гонись за аккой.<\/b> Поначалу точность может упасть: ты играешь по нотам, и это нормально. Ровные попадания вернут её."],"en":["<b>Drop the rate.<\/b> Find the speed where every note lands evenly and on its own. Start there.","<b>Go up slowly.<\/b> Add 0.05 rate at a time. As soon as notes start sticking together again, go back a step.","<b>Train the pattern itself.<\/b> Open the card for the pattern you glue together and play maps that have a lot of it: rolls, trills, split trills.","<b>Don't chase accuracy.<\/b> At first your accuracy may drop: you're playing the actual notes, and that's fine. Even hits will bring it back."]},"examples":[]},{"id":"ok","title":{"ru":"Когда это считают нормальным","en":"When people consider it fine"},"body":{"ru":["Тут игроки не сходятся. Одни спокойно склеивают очень быстрые роллы и считают это обычной техникой. Другие считают, что так ты играешь уже другой паттерн.","На некоторых картах ноты стоят так близко, что по отдельности их почти никто не играет. Тогда манип — просто способ пройти это место.","Главное — знать, что ты делаешь. Если склеиваешь нарочно и в одном месте, это твой выбор. Если не можешь сыграть паттерн иначе, его стоит потренировать."],"en":["Players disagree here. Some happily glue very fast rolls together and see it as a normal technique. Others feel you're then playing a different pattern.","On some maps the notes are so close that hardly anyone plays them one by one. Then manip is just a way through that part.","What matters is knowing what you're doing. If you glue notes on purpose in one spot, that's your call. If you can't play the pattern any other way, it's worth training."]},"examples":[]}],"cards":["Rolls","Trills","Minitrills","Stream","Jumptrill","Split trill","Jumpstream","Handstream","Dense handstream","Chordjack","Grace notes"],"sources":["https://community.etternaonline.com/t/manip-factor-metric-for-etterna/872","https://overthefraildream.net/writings/manip-counter","https://osu.ppy.sh/wiki/en/Gameplay/Judgement/osu!mania","https://osu.ppy.sh/wiki/en/Beatmap/Pattern/osu!mania/Trill"]},"styles":{"title":{"ru":"Стили игры","en":"Playstyles"},"lede":{"ru":["Стиль игры — это то, какими пальцами и на каких клавишах ты играешь. Названия ниже пришли из сообщества, и границы у них размытые: многие игроки смешивают стили.","На схемах {{под линией|над линией}} подписаны пальцы, а не клавиши: <b>Л<\/b> / <b>П<\/b> — левая или правая рука, <b>у<\/b> — указательный, <b>с<\/b> — средний, <b>б<\/b> — безымянный. В крупном виде снова видны твои клавиши, чтобы можно было сыграть."],"en":["A playstyle is which fingers and which keys you play with. The names below come from the community, and the lines between them are blurry: many players mix styles.","The charts show fingers {{under the line|above the line}}, not keys: <b>L<\/b> / <b>R<\/b> is the left or right hand, <b>i<\/b> the index, <b>m<\/b> the middle and <b>r<\/b> the ring finger. The large view shows your keys again, so you can play it."]},"cards":[{"id":"index","name":{"ru":"Индекс","en":"Index"},"keys":{"ru":"часто ← ↓ ↑ →","en":"often ← ↓ ↑ →"},"def":{"ru":"Играешь в основном двумя указательными пальцами. Обычно каждый берёт две колонки, например левый — 1 и 2, правый — 3 и 4. Другие пальцы подключаются, только когда паттерн этого требует.","en":"You play mostly with your two index fingers. Usually each one takes two columns, for example the left one 1 and 2, the right one 3 and 4. The other fingers join in only when a pattern needs them."},"hands":{"ru":["Чаще всего индекс играют на стрелках ← ↓ ↑ →, но клавиши могут быть любые.","Указательный не стоит на одной клавише, а ходит между двумя своими колонками.","Когда две ноты одной руки идут вместе (джамп 1+2 или 3+4), внешнюю колонку обычно берёт средний палец.","Кисть свободная, палец жмёт коротким движением и сразу отпускает."],"en":["Index is most often played on the arrow keys ← ↓ ↑ →, but any keys work.","The index finger doesn't sit on one key: it moves between its two columns.","When two notes on one hand come together (a 1+2 or 3+4 jump), the middle finger usually takes the outer column.","Keep the wrist loose: the finger presses with a short motion and lets go right away."]},"charts":[{"name":{"ru":"Стрим на две руки","en":"Stream across both hands"},"rows":"1 3 2 4 1 3 2 4","fingers":{"ru":["Лу","Лу","Пу","Пу"],"en":["Li","Li","Ri","Ri"]},"note":{"ru":"Руки идут по очереди, поэтому каждому указательному достаётся только каждая вторая нота. Это удобно.","en":"The hands take turns, so each index finger gets only every second note. That's comfortable."}},{"name":{"ru":"Трилл на одной руке","en":"One-hand trill"},"rows":"1 2 1 2 1 2 1 2","fingers":{"ru":["Лу","Лу","Пу","Пу"],"en":["Li","Li","Ri","Ri"]},"note":{"ru":"Один палец жмёт каждую ноту и ещё переходит в соседнюю колонку. На скорости это трудно.","en":"One finger presses every note and also has to move to the next column. At speed that's hard."}},{"name":{"ru":"Джамп на одной руке","en":"Jump on one hand"},"rows":"12 4 3 12 34 1 2","fingers":{"ru":["Лс","Лу","Пу","Пс"],"en":["Lm","Li","Ri","Rm"]},"note":{"ru":"Джамп 1+2 или 3+4 одним пальцем не взять. Внешнюю колонку жмёт средний.","en":"One finger can't take a 1+2 or 3+4 jump. The middle finger presses the outer column."}},{"name":{"ru":"Джек","en":"Jack"},"rows":"1 1 1 1 4 4 4 4","jacks":true,"fingers":{"ru":["Лу","Лу","Пу","Пу"],"en":["Li","Li","Ri","Ri"]},"note":{"ru":"Одна колонка подряд — один палец без переходов. Указательный тут на своём месте.","en":"One column over and over is one finger with no moving around. The index finger is at home here."}}],"easier":[{"card":"Jack","why":{"ru":"один палец бьёт одну колонку, и это указательный — обычно самый ловкий палец.","en":"one finger hits one column, and it's the index finger, usually the most nimble one."}},{"card":"Jumpjack","why":{"ru":"когда джамп на разные руки (1+3, 2+4), каждый указательный берёт свою ноту; джампы на одну руку (1+2, 3+4) индексу как раз тяжелее.","en":"when the jump is split across the hands (1+3, 2+4), each index finger takes its own note; one-hand jumps (1+2, 3+4) are the hard part for index."}},{"card":"Stream","why":{"ru":"когда руки чередуются, каждому пальцу достаётся только каждая вторая нота.","en":"when the hands alternate, each finger gets only every second note."}}],"harder":[{"card":"Trills","why":{"ru":"однорукий трилл — один палец на каждую ноту плюс переход между колонками.","en":"a one-hand trill is one finger on every note, plus moving between columns."}},{"card":"Rolls","why":{"ru":"на быстром ролле палец не успевает перейти, и ноты слипаются в джампы.","en":"on a fast roll the finger can't move over in time, and the notes stick together into jumps."}},{"card":"Split trill","why":{"ru":"13 24 — каждая рука играет трилл одним пальцем, и обе сразу.","en":"13 24 means each hand plays a trill with one finger, both at once."}},{"card":"Jumptrill","why":{"ru":"12 34 — на каждом джампе нужны два пальца одной руки.","en":"12 34 needs two fingers of one hand on every jump."}},{"card":"Handstream","why":{"ru":"хендам и квадам нужны три-четыре пальца сразу. На форумах это чаще всего называют слабым местом индекса.","en":"hands and quads need three or four fingers at once. Forum posts name this as index's weak spot most often."}},{"card":"Chordjack","why":{"ru":"те же аккорды, только ещё и подряд на одних колонках.","en":"the same chords, only now repeated on the same columns."}}],"mistakes":{"ru":["Средний палец висит далеко. Джамп на одной руке выходит поздно или рассыпается.","На быстрых триллах и роллах ноты склеиваются в джампы, и ты этого не замечаешь. Это <a href=\"#manip\">манип<\/a>.","Кисть зажата на длинных джеках. Рука устаёт, и ноты уезжают.","Хенды и квады ты обходишь стороной. От этого слабое место только растёт."],"en":["The middle finger hangs too far away. A jump on one hand comes late or falls apart.","On fast trills and rolls the notes stick together into jumps and you don't notice. That's <a href=\"#manip\">manip<\/a>.","The wrist is tense on long jacks. The hand gets tired and the notes drift.","You steer clear of hands and quads. That only makes the weak spot bigger."]},"practice":{"ru":["Однорукие триллы на низком рейте. Найди скорость, на которой каждая нота ровная, и поднимай понемногу.","Отдельно потренируй джампы 1+2 и 3+4 со средним пальцем.","Хендстрим и чордджек сначала медленно. Следи, чтобы аккорд падал разом.","Упёрся в хенды и квады — можно попробовать спред. Это не обязательно, просто вариант."],"en":["One-hand trills at a low rate. Find the speed where every note is even, and go up a little at a time.","Practise 1+2 and 3+4 jumps with the middle finger on their own.","Handstream and chordjack slowly at first. Make sure each chord lands at once.","Stuck on hands and quads? You can try spread. You don't have to, it's just an option."]},"note":{"ru":"Это общие советы, а не правила. Хороших текстов про индекс мало: в основном это мнения игроков на форумах.","en":"These are general tips, not rules. There's little good writing about index: mostly it's players' opinions on forums."}},{"id":"spread","name":{"ru":"Спред","en":"Spread"},"keys":{"ru":"D F J K","en":"D F J K"},"def":{"ru":"Четыре пальца, у каждой колонки свой: левые средний и указательный на D F, правые указательный и средний на J K. Это обычный стиль 4K: каждой клавише свой палец.","en":"Four fingers, one for each column: the left middle and index on D F, the right index and middle on J K. This is the usual 4K style: every key gets its own finger."},"charts":[{"name":{"ru":"Ролл","en":"Roll"},"rows":"1 2 3 4 3 2 1 2","fingers":{"ru":["Лс","Лу","Пу","Пс"],"en":["Lm","Li","Ri","Rm"]},"note":{"ru":"Каждая нота на своём пальце, переходить никуда не надо.","en":"Every note has its own finger, so nothing has to move over."}}],"points":{"ru":["Роллы, хенды и квады обычно идут легче: все пальцы уже на своих колонках.","Однорукие триллы многим даются тяжелее, особенно в слабой руке.","Длинные джеки на одном пальце утомляют."],"en":["Rolls, hands and quads usually come easier: every finger already sits on its column.","One-hand trills are harder for many players, especially on the weaker hand.","Long jacks on one finger get tiring."]},"related":["Rolls","Handstream","Trills","Longjacks"]},{"id":"split","name":{"ru":"Сплит","en":"Split"},"keys":{"ru":"например D F G + J","en":"e.g. D F G + J"},"def":{"ru":"Три клавиши под одной рукой и одна под другой. Так его описывает старый гайд сообщества. Стиль редкий.","en":"Three keys under one hand and one under the other. That's how an old community guide describes it. It's a rare style."},"charts":[{"name":{"ru":"Ролл","en":"Roll"},"rows":"1 2 3 4 1 2 3 4","fingers":{"ru":["Лб","Лс","Лу","Пу"],"en":["Lr","Lm","Li","Ri"]},"note":{"ru":"Колонки 1–3 играет одна рука, колонку 4 — указательный другой.","en":"One hand plays columns 1–3, the other hand's index finger plays column 4."}}],"points":{"ru":["Одной руке достаётся три колонки, поэтому плотные куски на 1–3 ложатся на неё одну.","Схема «две колонки на руку» из карточек здесь не работает: деление рук другое."],"en":["One hand gets three columns, so dense stretches on 1–3 all land on that one hand.","The cards' \"two columns per hand\" idea doesn't hold here: the hands are split differently."]},"related":["Rolls","Trills"]},{"id":"sprindex","name":{"ru":"Сприндекс","en":"Sprindex"},"keys":{"ru":"D F J K","en":"D F J K"},"def":{"ru":"Клавиши как в спреде (D F J K), а играешь в основном указательными, как в индексе. Средние пальцы подключаются, когда нужно.","en":"The keys are spread's (D F J K), but you play mostly with your index fingers, like in index. The middle fingers join in when needed."},"charts":[{"name":{"ru":"Стрим","en":"Stream"},"rows":"1 2 4 3 2 1 3 4","fingers":{"ru":["Лу","Лу","Пу","Пу"],"en":["Li","Li","Ri","Ri"]},"note":{"ru":"Как в индексе: каждый указательный ходит между двумя колонками.","en":"Like index: each index finger moves between two columns."}}],"points":{"ru":["Сильные и слабые места, скорее всего, похожи на индекс: играют те же указательные.","Подходит, если хочешь играть указательными, но привык к D F J K."],"en":["Its strong and weak spots are probably close to index's: the same index fingers do the work.","It suits you if you want to play with your index fingers but are used to D F J K."]},"related":["Trills","Jumptrill"]}],"sources":[{"url":"https://www.reddit.com/r/osugame/comments/556xfd/","note":{"ru":"r/osugame, 2016: раскладки Spread, Index, Sprindex и Split","en":"r/osugame, 2016: the Spread, Index, Sprindex and Split layouts"}},{"url":"https://osu.ppy.sh/wiki/en/Ranking_criteria/osu!mania","note":{"ru":"вики osu!: что такое стиль игры и обычный стиль «каждой клавише свой палец»","en":"osu! wiki: what a playstyle is, and the usual one-finger-per-key style"}},{"url":"https://www.flashflashrevolution.com/vbz/home/forum/general-discussion/introductions/81735-what-playing-style-should-you-choose","note":{"ru":"форум FFR: мнения игроков о спреде и одноруких триллах","en":"FFR forum: players' views on spread and one-hand trills"}},{"url":"https://www.flashflashrevolution.com/vbz/home/forum/general-discussion/introductions/48988-ffr-hand-postitions-guide","note":{"ru":"форум FFR: индекс слабее на хендах и квадах, спред сильнее на роллах, хендах и квадах","en":"FFR forum: index weaker on hands and quads, spread stronger on rolls, hands and quads"}}]}};

// ---- a chart on the page --------------------------------------------------------------------------------------
function stageBox(chart, label, small, sub0 = "") {

  // the size setting widens it, and it grows taller only while it still fits the screen below the toolbar

  const height = Math.min(Math.round((small ? 190 : 280) * z), stageCap());
  const t = T();
  const wrap = document.createElement("div");

    cur = c;
    sub = name;
    s = stage(c, label, width, height, false, z);
    s.ui = ui;
    s.meta = { open };
    s.svg.addEventListener("click", () => open());
    wrap.replaceChildren(s.svg, btns);

  restB.addEventListener("click", restart);

// Esc while the keys are being changed cancels the binding and leaves the big view open
dlg.addEventListener("cancel", (e) => { if (bind || performance.now() - bindEscAt < 500) e.preventDefault(); });
dlg.addEventListener("close", () => {
  if (bind) bindEnd(false);
  if (pl.s && eng.s === pl.s) stop();
  pl.s = null;
  pl.ptr.clear();
  dlg.replaceChildren();
  const card = pl.opener?.closest?.(".entry")?.id;
  if (pl.stale) {
    // the size changed inside the big view: redraw the page now, and give focus back to the same card's button
    pl.stale = false;
    renderKeep();
    if (card) pl.opener = document.querySelector(`#${card} .sbtn.expand`);
  }
  if (pl.opener && pl.opener.isConnected) pl.opener.focus({ preventScroll: true });
});
// a click on the dimmed page around the box closes it
dlg.addEventListener("click", (e) => {
  if (e.target !== dlg) return;
  const r = dlg.getBoundingClientRect();
  if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) dlg.close();
});
// F3 / F4 as in osu!mania, and − / + in the big view: slower / faster scroll, without stopping the chart
const SPEED_KEYS = { F3: -1, F4: 1, Minus: -1, NumpadSubtract: -1, Equal: 1, NumpadAdd: 1 };
document.addEventListener("keydown", (e) => {
  const dv = SPEED_KEYS[e.code];
  if (dv && !e.ctrlKey && !e.metaKey && !e.altKey && !RM.matches) {
    const tag = e.target.tagName;
    const typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || e.target.isContentEditable;
    const fkey = e.code === "F3" || e.code === "F4";
    if (!typing && ((dlg.open && pl.s) || (fkey && eng.s && !eng.paused))) {
      e.preventDefault();
      scrollStep(dv);
      return;
    }
  }
  const col = pkeys.indexOf(e.code);
  if (col < 0 || e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = e.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || e.target.isContentEditable) return;
  if (dlg.open) {
    if (!pl.s || RM.matches) return;
    e.preventDefault();
    if (e.repeat) return;
    if (eng.s !== pl.s || !eng.try) { start(pl.s, true); return; }
    if (eng.paused) resume();
    press(col, e.timeStamp);
    return;
  }
  // a column key while a chart on the page plays: open it large in "try it" mode
  if (eng.s && !eng.paused && eng.s.meta) { e.preventDefault(); eng.s.meta.open(true); }
});
document.addEventListener("keyup", (e) => {
  const col = pkeys.indexOf(e.code);
  if (col < 0 || !dlg.open) return;
  release(col);
  // a column key on Space or Enter must not also press the button that has the focus
  if (pl.s) e.preventDefault();
});

// ---- a pattern entry --------------------------------------------------------------------------------------
function listBlock(title, items) {
  const d = document.createElement("div");
  d.className = "block";
  const arr = Array.isArray(items) ? items : [items];
  d.innerHTML = `<h4>${esc(title)}</h4>${arr.length > 1 || Array.isArray(items) ? `<ul>${arr.map((x) => `<li>${x}</li>`).join("")}</ul>` : `<p>${arr[0] ?? ""}</p>`}`;
  return d;
}

function entry(p, openFam = p.fam) {
  const t = T();
  const el = document.createElement("article");
  el.className = p.base ? "entry base" : "entry";
  el.id = `p-${slug(p.en)}`;
  const variants = p.variants?.length ? p.variants : [{ name: { ru: p.ru, en: p.en }, note: p.def, rows: p.rows ?? "1 2 3 4" }];
  const stageCol = document.createElement("div");
  stageCol.className = "entry-stage";
  const box = stageBox(variants[0], p[lang], false);
  const cap = document.createElement("div");
  cap.className = "stage-cap";
  stageCol.append(box.wrap, cap);

  const body = document.createElement("div");
  body.className = "entry-body";
  const skills = (p.skill ?? []).map((s) => `<span class="badge">${esc(SKILL_NAMES[s]?.[lang] ?? s)}</span>`).join("");
  body.innerHTML = `<div class="entry-head"><h3 class="name">${esc(p[lang])}${lang === "ru" ? `<span class="en">${esc(p.en)}</span>` : ""}</h3>
      <div class="badges">${p.level ? `<span class="badge l${p.level}">${esc(t.level[p.level])}</span>` : ""}${skills}</div></div>
    <p class="def">${L(p.def)}</p>`;

  // variants as tabs
  const vRow = document.createElement("div");
  vRow.className = "row";
  vRow.innerHTML = `<span class="lbl">${esc(t.variants)}</span>`;
  const vNote = document.createElement("p");
  vNote.className = "vnote";
  variants.forEach((v, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = L(v.name);
    b.dataset.i = i;
    b.addEventListener("click", () => pick(i, true));
    vRow.append(b);
  });
  body.append(vRow, vNote);

  // the families it shows up in
  const fams = [p.fam, ...(p.also ?? []).map((a) => a.fam)].filter((id) => id !== "extra" && famById.has(id));
  let wRow = null, wNote = null;
  if (fams.length > 1 || (p.fam === "extra" && fams.length)) {
    wRow = document.createElement("div");
    wRow.className = "row";
    wRow.innerHTML = `<span class="lbl">${esc(t.where)}</span>`;
    wNote = document.createElement("p");
    wNote.className = "where-note";
    for (const id of fams) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = famById.get(id)[lang];
      b.dataset.fam = id;
      if (id === p.fam) b.className = "home";
      b.addEventListener("click", () => showFam(id));
      wRow.append(b);
    }
    body.append(wRow, wNote);
  }

  const blocks = document.createElement("div");
  blocks.className = "blocks";
  if (p.simple) blocks.append(listBlock(t.simple, L(p.simple)));
  if (p.howto) blocks.append(listBlock(t.howto, L(p.howto)));
  if (p.mistakes) blocks.append(listBlock(t.mistakes, L(p.mistakes)));
  if (p.practice) blocks.append(listBlock(t.practice, L(p.practice)));
  body.append(blocks);
  if (p.vs) body.insertAdjacentHTML("beforeend", `<p class="vs">${esc(t.vs)}${L(p.vs)}</p>`);
  const rel = (p.related ?? []).map((n) => byName.get(n)).filter(Boolean);
  if (rel.length) {
    const r = document.createElement("p");
    r.className = "rel";
    r.append(t.related);
    rel.forEach((q, i) => {
      if (i) r.append(", ");
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = q[lang];
      b.addEventListener("click", () => jumpTo(q));
      r.append(b);
    });
    body.append(r);
  }

  let curFam = p.fam;
  function pick(i, fromTab) {
    const v = variants[i];
    box.set(v, L(v.name));
    for (const b of vRow.querySelectorAll("button")) b.setAttribute("aria-pressed", String(Number(b.dataset.i) === i));
    const famTag = v.fam && v.fam !== p.fam ? ` <span class="badge fam">${esc(t.inFam.replace("{f}", famById.get(v.fam)[lang]))}</span>` : "";
    vNote.innerHTML = `${L(v.note)}${famTag} <code>${esc(notation(v))}</code>`;
    cap.textContent = L(v.name);
    if (fromTab) markFam(v.fam && v.fam !== p.fam ? v.fam : p.fam);
  }
  function markFam(id) {
    curFam = id;
    if (!wRow) return;
    for (const b of wRow.querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.fam === id));
    const a = alsoIn(p, id);
    wNote.textContent = id === p.fam ? (p.fam === "extra" ? "" : t.homeNote) : L(a?.note);
    wNote.hidden = !wNote.textContent;
  }
  function showFam(id) {
    const i = id === p.fam ? 0 : variants.findIndex((v) => v.fam === id);
    if (i >= 0) pick(i, false);
    markFam(id);
  }
  pick(0, false);
  markFam(p.fam);
  if (openFam !== p.fam && alsoIn(p, openFam)) showFam(openFam);

  el.append(stageCol, body);
  return el;
}

function jumpTo(p, famId) {
  const target = () => document.getElementById(`p-${slug(p.en)}`);
  const shown = view === "cards" && target();
  if (!shown || (famId && fam !== famId)) {
    view = "cards";
    // keep the reader's filters when the pattern fits them; widen only what hides it
    if (famId) fam = famId;
    else if (!(fam === "all" || p.fam === fam || alsoIn(p, fam))) fam = "all";
    if (level !== "all" && p.level !== level) level = "all";
    if (!p.base) mode = "detailed";
    render();
  }
  const el = target();
  if (!el) return;
  el.scrollIntoView({ behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), 1200);
}

// ---- sections -----------------------------------------------------------------------------------------------
function chapter(titleHtml, introNodes, content, sub = false, en = "") {
  const s = document.createElement("section");
  s.className = "chapter";
  const head = document.createElement("div");
  head.className = "chapter-head";
  head.innerHTML = `<div class="title"><h2${sub ? ' class="sub"' : ""}>${titleHtml}</h2>${en ? `<span class="en">${esc(en)}</span>` : ""}</div>`;
  for (const n of introNodes) head.append(n);
  s.append(head, content);
  return s;
}
const para = (html, cls) => { const p = document.createElement("p"); if (cls) p.className = cls; p.innerHTML = html; return p; };

function renderBasics(list) {
  const t = T();
  if (!C.basics?.length) return;
  const grid = document.createElement("div");
  grid.className = "lessons";
  C.basics.forEach((b, i) => {
    const card = document.createElement("div");
    card.className = b.chart ? "lesson" : "lesson nochart";
    const text = document.createElement("div");
    text.innerHTML = `<h3><span class="num">${i + 1}</span>${esc(L(b.title))}</h3><p>${L(b.text)}</p>`;
    card.append(text);
    if (b.chart) {
      const fig = document.createElement("figure");
      const box = stageBox(b.chart, L(b.title), true, b.chart.caption ? L(b.chart.caption) : "");
      fig.append(box.wrap);
      if (b.chart.caption) { const cap = document.createElement("figcaption"); cap.textContent = L(b.chart.caption); fig.append(cap); }
      card.append(fig);
    }
    grid.append(card);
  });
  const content = document.createElement("div");
  content.style.display = "grid";
  content.style.gap = "12px";
  content.append(grid);
  const steps = L(C.path);
  if (Array.isArray(steps) && steps.length) {
    const path = document.createElement("div");
    path.className = "path";
    path.innerHTML = `<h3>${esc(t.path)}</h3><ol>${steps.map((s) => `<li>${s}</li>`).join("")}</ol>`;
    content.append(path);
  }
  list.append(chapter(esc(t.basics), [para(esc(t.basicsAbout))], content));
}

function famHead(f) {
  const t = T();
  const info = famInfo.get(f.id);
  const nodes = [];
  if (info?.about) nodes.push(para(L(info.about)));
  const facts = document.createElement("div");
  facts.className = "facts";
  if (info?.hands) facts.append(para(`<b>${esc(t.hands)}:</b> ${L(info.hands)}`));
  if (info?.skill?.length) facts.append(para(`<b>${esc(t.skill)}:</b> ${info.skill.map((s) => esc(SKILL_NAMES[s]?.[lang] ?? s)).join(", ")}`));
  if (info?.tips) facts.append(para(`<b>${esc(t.tips)}:</b> ${L(info.tips)}`));
  if (facts.childNodes.length) nodes.push(facts);
  return nodes;
}

function visible(p) {
  return (mode === "detailed" || p.base) && (level === "all" || p.level === level);
}

function renderCards(list) {
  const t = T();
  let shown = 0;
  if (fam === "all" && level === "all") renderBasics(list);
  for (const f of FAMS) {
    if (f.detailedOnly && mode !== "detailed") continue;
    if (fam !== "all" && fam !== f.id) continue;
    const own = PATTERNS.filter((p) => p.fam === f.id && visible(p));
    const guests = fam === f.id && mode === "detailed" && f.id !== "extra" ? PATTERNS.filter((p) => p.fam !== f.id && alsoIn(p, f.id) && visible(p)) : [];
    if (!own.length && !guests.length) continue;
    const box = document.createElement("div");
    box.className = "entries";
    box.append(...own.map((p) => entry(p)));
    list.append(chapter(esc(f[lang]), famHead(f), box, false, lang === "ru" ? f.en : ""));
    shown += own.length;
    if (guests.length) {
      const g = document.createElement("div");
      g.className = "entries";
      g.append(...guests.map((p) => entry(p, f.id)));
      list.append(chapter(esc(t.alsoHere), [para(esc(t.alsoHereAbout))], g, true));
      shown += guests.length;
    }
  }
  if (!shown) list.append(para(esc(t.nothing)));
  if (fam === "all" && level === "all") renderGlossary(list);
  return shown;
}

function renderGlossary(list) {
  const t = T();
  if (!C.glossary?.length) return;
  const wrap = document.createElement("div");
  wrap.style.display = "grid";
  wrap.style.gap = "14px";
  const tools = document.createElement("div");
  tools.className = "gloss-tools";
  const input = document.createElement("input");
  input.type = "search";
  input.id = "gloss-q";
  input.placeholder = t.glossarySearch;
  input.setAttribute("aria-label", t.glossarySearch);
  tools.append(input);
  const dl = document.createElement("dl");
  dl.className = "gloss";
  const terms = [...C.glossary].sort((a, b) => L(a.term).localeCompare(L(b.term), lang));
  for (const g of terms) {
    const d = document.createElement("div");
    const other = lang === "ru" ? g.term.en : "";
    d.innerHTML = `<dt>${esc(L(g.term))}${other ? `<span class="en">${esc(other)}</span>` : ""}</dt><dd>${L(g.means)}</dd>`;
    d.dataset.text = `${g.term.ru} ${g.term.en} ${L(g.means)}`.toLowerCase();
    dl.append(d);
  }
  input.addEventListener("input", () => {
    const q = input.value.trim().toLowerCase();
    for (const d of dl.children) d.hidden = q && !d.dataset.text.includes(q);
  });
  wrap.append(tools, dl);
  list.append(chapter(esc(t.glossary), [para(esc(t.glossaryAbout))], wrap));
}

function renderTable(list) {
  const t = T();
  const wrapEl = document.createElement("div");
  wrapEl.className = "matrix-wrap";
  const table = document.createElement("table");
  table.className = "matrix";
  table.innerHTML = `<thead><tr><th scope="col" style="text-align:left">${esc(t.pattern)}</th>${MAIN.map((f) => `<th scope="col">${esc(f[lang])}</th>`).join("")}<th scope="col">${esc(t.levelCol)}</th><th scope="col">${esc(t.skillCol)}</th></tr></thead>`;
  const tbody = document.createElement("tbody");
  let shown = 0;
  for (const g of FAMS) {
    const rows = PATTERNS.filter((p) => p.fam === g.id && (level === "all" || p.level === level) && (fam === "all" || p.fam === fam || alsoIn(p, fam)));
    if (!rows.length) continue;
    tbody.insertAdjacentHTML("beforeend", `<tr class="group"><th colspan="${MAIN.length + 3}" scope="rowgroup">${esc(g[lang])}</th></tr>`);
    for (const p of rows) {
      const tr = document.createElement("tr");
      const name = document.createElement("th");
      name.scope = "row";
      const nb = document.createElement("button");
      nb.type = "button";
      nb.innerHTML = `${esc(p[lang])}${lang === "ru" ? `<span class="en">${esc(p.en)}</span>` : ""}`;
      nb.addEventListener("click", () => jumpTo(p));
      name.append(nb);
      tr.append(name);
      for (const f of MAIN) {
        const td = document.createElement("td");
        const a = alsoIn(p, f.id);
        if (p.fam === f.id || a) {
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = p.fam === f.id ? "●" : "○";
          const tip = p.fam === f.id ? t.homeNote : L(a.note);
          b.title = tip;
          b.setAttribute("aria-label", `${p[lang]} — ${f[lang]}: ${tip}`);
          b.addEventListener("click", () => jumpTo(p, f.id));
          td.append(b);
        }
        tr.append(td);
      }
      tr.insertAdjacentHTML("beforeend", `<td class="small">${p.level ? esc(t.level[p.level]) : ""}</td><td class="small">${(p.skill ?? []).map((s) => esc(SKILL_NAMES[s]?.[lang] ?? s)).join(", ")}</td>`);
      tbody.append(tr);
      shown += 1;
    }
  }
  table.append(tbody);
  wrapEl.append(table);
  const legend = document.createElement("div");
  legend.className = "legend";
  legend.innerHTML = `<span>${t.legendHome}</span><span>${t.legendAlso}</span>`;
  list.append(legend, wrapEl);
  if (!shown) list.append(para(esc(t.nothing)));
  return shown;
}

// ---- the page's bottom: playstyles, then manip ---------------------------------------------------------------
// a chart of these sections → what stageBox draws (the finger labels in the page's language)
const sideChart = (c, withFingers = true) => ({ rows: c.rows, ...(c.t ? { t: c.t } : {}), ...(c.hl ? { hl: c.hl } : {}),
  ...(withFingers && c.fingers ? { fingers: L(c.fingers) } : {}) });
function cardLink(name, cls = "lnk") {
  const p = byName.get(name);
  const b = document.createElement("button");
  b.type = "button";
  if (cls) b.className = cls;
  b.textContent = p ? p[lang] : name;
  if (p) b.addEventListener("click", () => jumpTo(p));
  else b.disabled = true;
  return b;
}
function linkBlock(title, items) {
  const d = document.createElement("div");
  d.className = "block";
  d.innerHTML = `<h4>${esc(title)}</h4><ul></ul>`;
  const ul = d.querySelector("ul");
  for (const x of items) {
    const li = document.createElement("li");
    li.append(cardLink(x.card), " — ");
    li.insertAdjacentHTML("beforeend", L(x.why));
    ul.append(li);
  }
  return d;
}
function sourcesBlock(list) {
  const d = document.createElement("div");
  d.style.display = "grid";
  d.style.gap = "4px";
  const items = list.map((s) => {
    const url = typeof s === "string" ? s : s.url;
    const note = typeof s === "string" ? "" : L(s.note);
    return `<li><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(url.replace(/^https?:\/\/(www\.)?/, ""))}</a>${note ? ` — ${esc(note)}` : ""}</li>`;
  });
  d.innerHTML = `<p class="src-title">${esc(T().sources)}</p><ol class="sources">${items.join("")}</ol>`;
  return d;
}
function sideHead(o, id) {
  const head = document.createElement("div");
  head.className = "chapter-head";
  head.innerHTML = `<div class="title"><h2 id="${id}">${esc(L(o.title))}</h2>${lang === "ru" ? `<span class="en">${esc(o.title.en)}</span>` : ""}</div>`;
  for (const x of [].concat(L(o.lede))) head.append(para(x));
  return head;
}
// one playstyle, laid out like a pattern card: its charts (fingers under the line) as tabs beside the text
function styleEntry(st, small) {
  const t = T();
  const el = document.createElement("article");
  el.className = "entry style";
  el.id = `st-${slug(st.id)}`;
  const name = L(st.name);
  const charts = st.charts ?? [];
  const body = document.createElement("div");
  body.className = "entry-body";
  body.innerHTML = `<div class="entry-head"><h3 class="name">${esc(name)}${lang === "ru" ? `<span class="en">${esc(st.name.en)}</span>` : ""}</h3>
      <div class="badges">${st.keys ? `<span class="badge keys">${esc(L(st.keys))}</span>` : ""}</div></div>
    <p class="def">${L(st.def)}</p>`;
  if (charts.length) {
    const stageCol = document.createElement("div");
    stageCol.className = "entry-stage";
    const box = stageBox(sideChart(charts[0]), name, small, L(charts[0].name));
    const cap = document.createElement("div");
    cap.className = "stage-cap";
    stageCol.append(box.wrap, cap);
    el.append(stageCol);
    const vRow = document.createElement("div");
    vRow.className = "row";
    vRow.innerHTML = `<span class="lbl">${esc(t.charts)}</span>`;
    const vNote = document.createElement("p");
    vNote.className = "vnote";
    const pick = (i) => {
      const c = charts[i];
      box.set(sideChart(c), L(c.name));
      for (const b of vRow.querySelectorAll("button")) b.setAttribute("aria-pressed", String(Number(b.dataset.i) === i));
      vNote.innerHTML = `${L(c.note)} <code>${esc(notation(c))}</code>`;
      cap.textContent = `${L(c.name)} · ${t.fingers}`;
    };
    charts.forEach((c, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = L(c.name);
      b.dataset.i = i;
      b.addEventListener("click", () => pick(i));
      vRow.append(b);
    });
    if (charts.length < 2) vRow.hidden = true;
    body.append(vRow, vNote);
    pick(0);
  }
  const blocks = document.createElement("div");
  blocks.className = "blocks";
  if (st.hands) blocks.append(listBlock(t.stHands, L(st.hands)));
  if (st.points) blocks.append(listBlock(t.stPoints, L(st.points)));
  if (st.easier?.length) blocks.append(linkBlock(t.easier, st.easier));
  if (st.harder?.length) blocks.append(linkBlock(t.harder, st.harder));
  if (st.mistakes) blocks.append(listBlock(t.mistakes, L(st.mistakes)));
  if (st.practice) blocks.append(listBlock(t.practice, L(st.practice)));
  if (blocks.childNodes.length) body.append(blocks);
  if (st.related?.length) {
    const r = document.createElement("p");
    r.className = "rel";
    r.append(t.stCards);
    st.related.forEach((n, i) => { if (i) r.append(", "); r.append(cardLink(n, "")); });
    body.append(r);
  }
  if (st.note) body.append(para(esc(L(st.note)), "style-note"));
  el.append(body);
  return el;
}
function renderStyles() {
  const sec = document.getElementById("styles");
  const S = C.styles;
  sec.hidden = !S;
  document.getElementById("jl-styles").hidden = !S;
  if (!S) { sec.replaceChildren(); return; }
  const [main, ...rest] = S.cards ?? [];
  const entries = document.createElement("div");
  entries.className = "entries";
  if (main) entries.append(styleEntry(main, false));
  const sub = document.createElement("div");
  sub.className = "style-sub";
  sub.append(...rest.map((c) => styleEntry(c, true)));

  const first = rd.set.difficulties.find((d) => d.ok);
  rdBox.innerHTML = `<div class="rd-head"><div><div class="eyebrow">${esc(t.title)}</div><h2 id="rd-title">${esc(rdSetTitle(first?.meta))}</h2>
      <p class="rd-meta">${esc(rd.set.name)}</p></div><button type="button" class="rd-btn ghost" data-pick>${esc(t.another)}</button></div>
    <p class="rd-hint">${esc(t.choose)}</p><ul class="rd-choose"></ul>${privacy}`;
  const ul = rdBox.querySelector(".rd-choose");
  for (const d of rd.set.difficulties) {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = `<span>${esc(d.meta?.version || d.file)}</span><span>${esc(d.ok ? t.notes(d.notes) : rdErrText(d.reason))}</span>`;
    if (d.ok) b.addEventListener("click", () => rdAnalyze(d));
    else { b.disabled = true; b.title = rdErrText(d.reason); }
    li.append(b);
    ul.append(li);
  }
  ul.querySelector("button:not(:disabled)")?.focus({ preventScroll: true });
}
function rdResult(privacy) {
  const t = RT(), a = rd.a, m = a.meta ?? {};
  const bpm = a.timing?.mainBpm ? `${Math.round(a.timing.mainBpm)} BPM` : "";
  const facts = [m.version ? `[${m.version}]` : "", m.creator, bpm, mmss(a.lengthMs), t.notes(a.notes), t.partsN(a.parts.length)].filter(Boolean);
  // above the breakdown: the "reading" line while the next file reads, or why the last file could not replace it
  const top = rd.busy ? `<p class="rd-status" role="status">${esc(t.reading)}</p>` : rd.notice ? rdErrHtml(rd.notice) + `<p class="rd-note">${esc(t.kept)}</p>` : "";
  rdBox.innerHTML = `${top}<div class="rd-head"><div><div class="eyebrow">${esc(t.title)}</div><h2 id="rd-title">${esc(rdSetTitle(m))}</h2>
      <p class="rd-meta">${esc(facts.join(" · "))}</p></div><button type="button" class="rd-btn ghost" data-pick${rd.busy ? " disabled" : ""}>${esc(t.another)}</button></div>
    <div class="row rd-diffs" hidden><span class="lbl">${esc(t.diffs)}</span></div>
    <div class="row rd-sum"><span class="lbl">${esc(t.main)}</span></div>
    <div class="rd-strip"><div class="rd-track" role="group" aria-label="${esc(t.parts)}"></div></div>
    <div class="rd-legend"></div>
    <div class="rd-part" id="rd-part" aria-live="polite"></div>${privacy}`;
  // the other 4K difficulties of the set
  const ok = rd.set?.difficulties.filter((d) => d.ok) ?? [];
  if (ok.length > 1) {
    const row = rdBox.querySelector(".rd-diffs");
    row.hidden = false;
    for (const d of ok) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = d.meta?.version || d.file;
      b.title = t.notes(d.notes);
      b.setAttribute("aria-pressed", String(d === rd.diff));
      b.addEventListener("click", () => { if (d !== rd.diff) rdAnalyze(d); });
      row.append(b);
    }
  }
  // the map's main cards by played time
  const sum = rdBox.querySelector(".rd-sum");
  const cards = (a.summary?.cards ?? []).filter((c) => c.share >= 0.03).slice(0, 7);
  if (!cards.length) sum.hidden = true;
  for (const c of cards) {
    const b = document.createElement("button");
    b.type = "button";
    b.style.setProperty("--fc", famVar(famOfCard(c.card)));
    b.innerHTML = `<span class="rd-dot"></span>${esc(cardName(c.card, c.name))}<span class="pc">${Math.round(c.share * 100)}%</span>`;
    b.disabled = !byName.has(c.card);
    b.addEventListener("click", () => rdGo(c.card));
    sum.append(b);
  }
  rdStrip();
  rdPartView();
}
function rdStrip() {
  const t = RT(), a = rd.a, parts = a.parts;
  const track = rdBox.querySelector(".rd-track");
  const t0 = parts[0].startMs, t1 = parts[parts.length - 1].endMs, total = Math.max(1, t1 - t0);
  // proportional to time; the shortest part still gets a finger's width, so the strip grows and scrolls inside itself
  const shortest = Math.max(200, Math.min(...parts.map((p) => p.durationMs)));
  track.style.width = `max(100%, ${Math.min(9000, Math.round((22 * total) / shortest))}px)`;
  const pc = (ms) => `${((100 * (ms - t0)) / total).toFixed(3)}%`;
  for (const p of parts) {
    const b = document.createElement("button");
    b.type = "button";
    const quiet = p.kind !== "pattern";
    const tent = tentative(p);
    b.className = `rd-seg${quiet ? ` quiet ${p.kind}` : ""}${tent ? " tent" : ""}`;
    if (!quiet) b.style.setProperty("--fc", famVar(partFam(p)));
    b.style.left = `calc(${pc(p.startMs)} + 1px)`;
    b.style.width = `max(3px, calc(${((100 * p.durationMs) / total).toFixed(3)}% - 2px))`;
    const name = quiet ? (p.kind === "break" ? t.breakShort : t.calmShort) : `${tent ? t.likeShort : ""}${cardName(p.main.card, p.label)}`;
    const full = quiet ? L(p.label) : `${tent ? t.like : ""}${cardName(p.main.card, p.label)}`;
    b.innerHTML = `<span class="lb">${esc(name)}</span>`;
    b.title = `${full} · ${mmss(p.startMs)}–${mmss(p.endMs)}`;
    b.setAttribute("aria-label", `${t.partOf.replace("{i}", p.index + 1).replace("{n}", parts.length)}: ${full}, ${mmss(p.startMs)}–${mmss(p.endMs)}`);
    b.setAttribute("aria-pressed", String(p.index === rd.index));
    b.dataset.i = p.index;
    b.addEventListener("click", () => rdSelect(p.index, { reveal: true }));
    track.append(b);
  }
  const every = total <= 90000 ? 15000 : total <= 300000 ? 30000 : 60000;
  for (let ms = Math.ceil(t0 / every) * every; ms <= t1; ms += every) {
    const tk = document.createElement("span");
    tk.className = "rd-tick";
    tk.style.left = pc(ms);
    tk.textContent = mmss(ms);
    track.append(tk);
  }
  if (!track.querySelector(".rd-tick") || (Math.ceil(t0 / every) * every - t0) / total > 0.08) {
    const tk = document.createElement("span");
    tk.className = "rd-tick first";
    tk.style.left = "0";
    tk.textContent = mmss(t0);
    track.prepend(tk);
  }
  // the colour key: the families that are in this map, then what hatched and grey mean
  const fams = [...new Set(parts.filter((p) => p.kind === "pattern").map(partFam))].filter(Boolean);
  const legend = rdBox.querySelector(".rd-legend");
  legend.innerHTML = fams.map((f) => `<span><i style="background:${famVar(f)}"></i>${esc(famById.get(f)?.[lang] ?? f)}</span>`).join("")
    + (parts.some(tentative) ? `<span><i class="tent"></i>${esc(t.legendTent)}</span>` : "")
    + (parts.some((p) => p.kind !== "pattern") ? `<span><i class="quiet"></i>${esc(t.legendQuiet)}</span>` : "");
  rdFitLabels();
  rdRevealSeg();
}
// a label shows only where it fits its part
function rdFitLabels() {
  for (const b of rdBox.querySelectorAll(".rd-seg")) {
    const lb = b.firstElementChild;
    b.classList.toggle("nolabel", lb.offsetWidth > b.clientWidth - 8);
  }
}
const rdRO = window.ResizeObserver ? new ResizeObserver(() => rdFitLabels()) : null;
// the chosen part stays inside the strip's own scroll, without moving the page
function rdRevealSeg() {
  const strip = rdBox.querySelector(".rd-strip");
  const seg = rdBox.querySelector(`.rd-seg[data-i="${rd.index}"]`);
  if (!strip || !seg) return;
  const l = seg.offsetLeft, r = l + seg.offsetWidth;
  if (l < strip.scrollLeft + 8) strip.scrollLeft = Math.max(0, l - 24);
  else if (r > strip.scrollLeft + strip.clientWidth - 8) strip.scrollLeft = r - strip.clientWidth + 24;
}

// ---- one part ----
function rdSelect(i, opts = {}) {
  const a = rd.a;
  if (!a) return;
  i = Math.max(0, Math.min(a.parts.length - 1, i));
  const playing = rd.ps && eng.s === rd.ps && !eng.paused;
  rd.index = i;
  for (const b of rdBox.querySelectorAll(".rd-seg")) b.setAttribute("aria-pressed", String(Number(b.dataset.i) === i));
  rdPartView();
  rdRevealSeg();
  if (opts.focus) rdBox.querySelector(`.rd-seg[data-i="${i}"]`)?.focus({ preventScroll: true });
  if (playing && rd.ps) start(rd.ps);
  if (opts.reveal) {
    const pv = document.getElementById("rd-part");
    const r = pv?.getBoundingClientRect();
    if (r && r.top > window.innerHeight - 120) pv.scrollIntoView({ behavior: RM.matches ? "auto" : "smooth", block: "nearest" });
  }
}
// a part's rows → a chart the page's stage draws: columns as "12 3 4", times in the player's 100 ms steps
function rdChart(p) {
  if (!p.rows?.length) return null;
  const t0 = p.rows[0].t;
  return {
    rows: p.rows.map((r) => [0, 1, 2, 3].filter((c) => r.mask & (1 << c)).map((c) => c + 1).join("")).join(" "),
    t: p.rows.map((r) => Math.round(((r.t - t0) / STEP_MS) * 1000) / 1000),
    t0, bpm: p.bpm,
  };
}
// the still picture at the spacing the notes will fly at (the stage's own still squeezes the whole chart in)
function rdStill(s) {
  const u = rowPx(s);
  if (s.stillU === u) return;
  s.stillU = u;
  const nr = Math.max(4 * s.z, Math.min(s.r, (s.dense * u - s.gap) / 2));
  s.rows.forEach((row, i) => { for (const n of s.stillRows[i]) { n.setAttribute("cy", s.lineY - s.lead - row.t * u); n.setAttribute("r", nr); } });
}
function rdStageBox(chart, label, sub) {
  const t = T();
  const z = Z();
  const width = Math.round(150 * z);
  const height = Math.min(Math.round(330 * z), stageCap());
  const s = stage(chart, label, width, height, false, z);
  s.svg.setAttribute("aria-label", `${label} · ${sub}`);
  const wrap = document.createElement("div");
  wrap.className = `stage-wrap${dir === "up" ? " up" : ""}`;
  wrap.style.width = `${width}px`;
  const btns = document.createElement("div");
  btns.className = "stage-btns";
  const playB = iconBtn("play", "play"), restB = iconBtn("restart", "restart"), bigB = iconBtn("expand", "expand");
  restB.setAttribute("aria-label", `${t.restart}: ${label}`);
  bigB.setAttribute("aria-label", `${t.expand}: ${label}`);
  btns.append(playB, restB, bigB);
  const open = (tryMode = false) => openPlayer(chart, label, sub, tryMode === true, bigB);
  s.ui = (state) => {
    if (state === "stats") return;
    const on = state === "play";
    playB.innerHTML = icon(on ? "pause" : "play");
    playB.classList.toggle("on", state !== "stop");
    playB.setAttribute("aria-label", `${on ? T().pause : T().play}: ${label}`);
    restB.hidden = state === "stop";
    if (state === "stop") { s.stillU = 0; rdStill(s); }
  };
  s.meta = { open };
  s.svg.addEventListener("click", () => open());
  playB.addEventListener("click", () => toggle(s));
  restB.addEventListener("click", () => start(s));
  bigB.addEventListener("click", () => open());
  wrap.append(s.svg, btns);
  rdStill(s);
  s.ui("stop");
  return { wrap, s };
}
function rdPartView() {
  const pv = document.getElementById("rd-part");
  if (!pv || !rd.a) return;
  const t = RT(), parts = rd.a.parts;
  const p = parts[rd.index];
  rdLeave();
  if (!p) { pv.innerHTML = `<p class="rd-hint">${esc(t.pickPart)}</p>`; return; }
  const quiet = p.kind !== "pattern";
  const tent = tentative(p);
  const card = p.main ? byName.get(p.main.card) : null;
  const name = quiet ? L(p.label) : cardName(p.main.card, p.label);
  const range = `${mmss(p.startMs)}–${mmss(p.endMs)}`;
  const nw = (s) => `<span style="white-space:nowrap">${esc(s)}</span>`;
  pv.innerHTML = `<div class="rd-nav"><span class="pos">${nw(t.partOf.replace("{i}", p.index + 1).replace("{n}", parts.length))} · ${nw(range)} · ${nw(secs(p.durationMs))}</span></div>
    <div class="rd-body"><div class="rd-stagecol"></div><div class="rd-text"></div></div>`;
  const nav = pv.querySelector(".rd-nav");
  const prev = iconBtn("chip", "prev"), next = iconBtn("chip", "next");
  prev.setAttribute("aria-label", t.prev); prev.title = t.prev;
  next.setAttribute("aria-label", t.next); next.title = t.next;
  prev.disabled = p.index === 0;
  next.disabled = p.index === parts.length - 1;
  prev.addEventListener("click", () => rdSelect(p.index - 1));
  next.addEventListener("click", () => rdSelect(p.index + 1));
  nav.prepend(prev);
  nav.append(next);
  // the chart of the part, played by the page's own player
  const col = pv.querySelector(".rd-stagecol");
  const chart = rdChart(p);
  if (chart) {
    const box = rdStageBox(chart, name, `${t.partOf.replace("{i}", p.index + 1).replace("{n}", parts.length)} · ${range}`);
    rd.chart = chart;
    rd.ps = box.s;
    const cap = document.createElement("div");
    cap.className = "stage-cap";
    cap.textContent = `♩ ${Math.round(p.bpm)} · ${(p.nps ?? 0).toLocaleString(lang)} ${t.nps}`;
    col.append(box.wrap, cap);
  } else col.remove();
  // what it is and why
  const text = pv.querySelector(".rd-text");
  const fam = partFam(p);
  const famBadge = !quiet && famById.has(fam) ? `<span class="badge" style="color:${famVar(fam)}">${esc(t.family.replace("{f}", famById.get(fam)[lang]))}</span>` : "";
  let html = `<div class="entry-head"><h3 class="name">${tent ? `<span class="like">${esc(t.like)}</span>` : ""}${esc(name)}${!quiet && lang === "ru" && card ? `<span class="en">${esc(card.en)}</span>` : ""}</h3>
    <div class="badges">${famBadge}</div></div>`;
  if (quiet) html += `<p class="def">${esc(p.kind === "break" ? t.breakText.replace("{s}", secs(p.durationMs)) : t.calmText)}</p>`;
  else {
    const h = p.hint ?? {};
    const def = card?.def ? L(card.def) : h.def ? L(h.def) : card?.simple ? L(card.simple) : "";
    if (def) html += `<p class="def">${Array.isArray(def) ? def.join(" ") : def}</p>`;
    if (h.why) html += `<p class="rd-why"><b>${esc(t.why)}</b> ${esc(L(h.why))}</p>`;
    const vi = rdVariantIndex(card, h.variant);
    const v = vi >= 0 ? card.variants[vi] : null;
    if (v) html += `<p class="vnote">${esc(t.variant.replace("{v}", L(v.name)))}</p>`;
    else if (h.showFam && famById.has(h.showFam)) html += `<p class="vnote">${esc(t.famVariant.replace("{f}", famById.get(h.showFam)[lang]))}</p>`;
    if (tent) html += `<p class="rd-note">${esc(t.tentNote)}</p>`;
  }
  text.innerHTML = html;
  // the other patterns listed for this part
  const others = [];
  for (const x of p.patterns ?? []) if (x.card !== p.main?.card && !others.some((o) => o.card === x.card)) others.push(x);
  if (others.length) {
    const row = document.createElement("div");
    row.className = "row rd-also";
    row.innerHTML = `<span class="lbl">${esc(t.also)}</span>`;
    for (const x of others) {
      const b = document.createElement("button");
      b.type = "button";
      b.style.setProperty("--fc", famVar(famOfCard(x.card)));
      b.innerHTML = `<span class="rd-dot"></span>${esc(cardName(x.card, x.name))}`;
      if (x.share != null) b.title = `${Math.round(x.share * 100)}%`;
      b.disabled = !byName.has(x.card);
      b.addEventListener("click", () => rdGo(x.card, x.variant));
      row.append(b);
    }
    text.append(row);
  }
  const acts = document.createElement("div");
  acts.className = "rd-acts";
  if (!quiet && card) {
    const go = document.createElement("button");
    go.type = "button";
    go.className = "rd-btn";
    go.textContent = t.go;
    go.addEventListener("click", () => rdGo(p.main.card, p.hint?.variant, p.hint?.showFam));
    acts.append(go);
  }
  if (chart && rd.audio) {
    const mb = document.createElement("button");
    mb.type = "button";
    mb.className = "pl-try";
    mb.textContent = `♪ ${t.music}`;
    mb.title = t.musicTitle;
    mb.setAttribute("aria-pressed", String(rd.music));
    mb.addEventListener("click", () => { rd.music = !rd.music; mb.setAttribute("aria-pressed", String(rd.music)); });
    acts.append(mb);
  }
  if (acts.childNodes.length) text.append(acts);
  const notes = [];
  if (chart && !RM.matches) notes.push(t.controls);
  if (chart && !rd.audio) notes.push(rd.audioNote || (rd.set?.kind === "osz" ? "" : t.noMusic));
  if (p.holds?.length) notes.push(t.ln);
  for (const n of notes.filter(Boolean)) text.insertAdjacentHTML("beforeend", `<p class="rd-note">${esc(n)}</p>`);
}

// ---- the song in sync with the part's chart (here or in the big view): the chart's clock leads, the song follows ----
function rdTick() {
  rd.raf = requestAnimationFrame(rdTick);
  if (rd.ps && eng.s !== rd.ps) rdStill(rd.ps); // a scroll or tempo change while stopped respaces the still picture
  const el = rd.audio, s = eng.s;
  // the stage's tempo label: the part's own BPM at the chosen tempo, not the player's base
  if (s && rd.chart && s.c === rd.chart && rd.chart.bpm) {
    const b = Math.round(rd.chart.bpm * tempo);
    const txt = s.width / s.z < 100 ? `♩${b}` : `♩ ${b} BPM`;
    if (s.bpm.textContent !== txt) s.bpm.textContent = txt;
  }
  const on = el && rd.music && s && rd.chart && s.c === rd.chart && !eng.paused;
  if (!on) { if (el && !el.paused) el.pause(); return; }
  let ph = eng.ph;
  if (ph >= 0) ph %= s.P; // the chart loops; so does the song
  const want = (rd.chart.t0 + ph * STEP_MS) / 1000;
  if (want < 0 || want > el.duration) { if (!el.paused) el.pause(); return; }
  if (el.playbackRate !== tempo) el.playbackRate = tempo;
  const now = performance.now();
  if (el.paused) { el.currentTime = want; rd.seekAt = now; el.play().catch(() => {}); return; }
  if (Math.abs(el.currentTime - want) > 0.1 && now - rd.seekAt > 400) { el.currentTime = want; rd.seekAt = now; }
}

// ---- to a card and back ----
function rdGo(cardEn, variant = null, showFamId = null) {
  const p = byName.get(cardEn);
  if (!p) return;
  rd.back = true;
  jumpTo(p);
  const el = document.getElementById(`p-${slug(p.en)}`);
  if (el) {
    // a variant the part names opens on the card, the first one too (another family's view may be showing)
    const vi = rdVariantIndex(p, variant);
    if (vi >= 0) el.querySelector(`.row button[data-i="${vi}"]`)?.click();
    else if (showFamId) el.querySelector(`.row button[data-fam="${showFamId}"]`)?.click();
    el.tabIndex = -1;
    el.focus({ preventScroll: true });
  }
  rdSyncBack();
}
function rdReturn() {
  rd.back = false;
  rdSyncBack();
  const target = rd.index >= 0 && document.getElementById("rd-part") ? document.getElementById("rd-part") : reader;
  const seg = rdBox.querySelector(`.rd-seg[data-i="${rd.index}"]`);
  (seg ?? rdBox.querySelector("button"))?.focus({ preventScroll: true });
  rdRevealSeg();
  target.scrollIntoView({ behavior: RM.matches ? "auto" : "smooth", block: "start" });
}
function rdSyncBack() {
  rdBackB.textContent = RT().back;
  rdBackB.hidden = !(rd.back && !rd.inView);
}
if (window.IntersectionObserver) {
  new IntersectionObserver((es) => {
    for (const e of es) rd.inView = e.isIntersecting;
    if (rd.inView) rd.back = false;
    rdSyncBack();
  }).observe(reader);
}
rdBackB.addEventListener("click", rdReturn);

// language, scroll direction and size redraw the section; filters and views leave it as it is
function rdSync() {
  if (!READER) return;
  rdOpenB.textContent = RT().open;
  rdOpenB.title = RT().openTitle;
  rdSyncBack();
  if (rd.sig !== `${lang}|${dir}|${size}`) rdRender();
}

// ---- input: the picker, a drop anywhere on the page, ← / → through the parts ----
if (READER) {
  reader.hidden = false;
  rdOpenB.hidden = false;
  if (!window.matchMedia("(pointer: coarse)").matches) rdInput.accept = ".osu,.osz";
  rdInput.addEventListener("change", () => { const f = rdInput.files?.[0]; if (f) rdFile(f); });
  rdOpenB.addEventListener("click", () => {
    reader.scrollIntoView({ behavior: RM.matches ? "auto" : "smooth", block: "start" });
    if ((rd.state === "idle" || rd.state === "error") && !rd.busy) rdPick();
    else (rdBox.querySelector(`.rd-seg[data-i="${rd.index}"]`) ?? rdBox.querySelector("button"))?.focus({ preventScroll: true });
  });
  const hasFiles = (e) => [...(e.dataTransfer?.types ?? [])].includes("Files");
  let dragT = 0;
  window.addEventListener("dragover", (e) => {
    if (!hasFiles(e) || dlg.open) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "copy";
    reader.classList.add("drag");
    clearTimeout(dragT);
    dragT = setTimeout(() => reader.classList.remove("drag"), 160);
  });
  window.addEventListener("drop", (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    reader.classList.remove("drag");
    if (dlg.open) return;
    const f = e.dataTransfer.files?.[0];
    if (!f) return;
    if (!reader.contains(e.target)) reader.scrollIntoView({ behavior: RM.matches ? "auto" : "smooth", block: "start" });
    rdFile(f);
  });
  document.addEventListener("keydown", (e) => {
    if (e.code !== "ArrowLeft" && e.code !== "ArrowRight") return;
    if (rd.state !== "result" || dlg.open || bind || e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) return;
    const tag = e.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || e.target.isContentEditable) return;
    // an arrow bound to a column plays it while a chart moves
    if (pkeys.includes(e.code) && eng.s && !eng.paused) return;
    if (!reader.contains(document.activeElement) && !rd.inView) return;
    e.preventDefault();
    const dv = e.code === "ArrowLeft" ? -1 : 1;
    rdSelect(rd.index < 0 ? (dv > 0 ? 0 : rd.a.parts.length - 1) : rd.index + dv, { focus: reader.contains(document.activeElement) || document.activeElement === document.body });
  });
  if (rdRO) rdRO.observe(reader);
  rdTick();
  rdSync();
}
</script>
