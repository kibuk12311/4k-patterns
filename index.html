e":{"ru":"Лесенка вправо","en":"Staircase to the right"},"note":{"ru":"Ноты идут слева направо, и джамп каждый раз встаёт на новую ступеньку.","en":"The notes go left to right, and the jump lands on a new step each time."},"rows":"12 3 4 1 23 4 1 2 34 1 2 3"},{"name":{"ru":"Лесенка влево","en":"Staircase to the left"},"note":{"ru":"Зеркало первой: ноты идут справа налево, а джамп каждый раз встаёт на новую ступеньку.","en":"The mirror of the first: notes go right to left, and the jump lands on a new step each time."},"rows":"34 2 1 4 23 1 4 3 12 4 3 2"},{"name":{"ru":"С разворотом","en":"With a turn"},"note":{"ru":"Лесенка доходит до края и разворачивается. Самое трудное место — разворот.","en":"The staircase reaches the edge and turns back. The turn is the hardest spot."},"rows":"12 3 4 1 23 4 3 2 1 4 23 1"},{"name":{"ru":"С хендами","en":"With hands"},"note":{"ru":"Хенд стоит в начале лесенки, а за ним ноты скатываются дальше.","en":"A hand starts the staircase and the notes roll on after it."},"rows":"123 4 1 2 34 1 2 3 124 3 2 1","fam":"handstream"},{"name":{"ru":"Быстрые дампы","en":"Fast dumps"},"note":{"ru":"Тройки нот стоят на 1/8, а между ними пауза. На скорости они близки к грейс-нотам (очень быстрым нотам прямо перед основной).","en":"Each three-note run is at 1/8 with a gap before the next. At speed they come close to grace notes (very quick notes right before the main one)."},"rows":"12 3 4 1 23 4 1 2 34","t":[0,0.5,1,2,2.5,3,4,4.5,5],"fam":"tech"},{"name":{"ru":"Плотная лесенка","en":"Dense staircase"},"note":{"ru":"Джампы стоят почти вплотную, а лесенка всё равно идёт вправо: [12], [34], 1, [23], 4. Одиночных нот мало, рукам почти некогда отдыхать.","en":"Jumps sit almost back to back, yet the staircase still runs right: [12], [34], 1, [23], 4. Few single notes, so the hands barely get a rest."},"rows":"12 34 1 23 4 12 34 1 23 4 12 34"},{"name":{"ru":"Триплеты влево на 1/6","en":"Left triplets at 1/6"},"note":{"ru":"Лесенка идёт справа налево группами по три ноты на 1/6, между группами короткая пауза. Каждая группа — быстрый «скат» к левому краю.","en":"The staircase runs right to left in groups of three notes at 1/6, with a short pause between groups. Each group is a fast slide to the left edge."},"rows":"34 2 1 4 23 1 34 2 1 4 23 1","t":[0,0.667,1.333,2.667,3.333,4,5.333,6,6.667,8,8.667,9.333]},{"name":{"ru":"Лесенка с пропущенной ступенькой","en":"Staircase with a skipped step"},"note":{"ru":"Одна лесенка начинается не с колонки 1, а с колонки 2. Рука ждёт привычный край, а получает ноту ближе к центру — это брейк.","en":"One staircase starts on column 2 instead of column 1. The hand expects the usual edge and gets a note closer to the middle — that's the break."},"rows":"12 3 4 1 23 4 2 3 4 1 2 34"},{"name":{"ru":"С джамптриллом посередине","en":"With a jumptrill in the middle"},"note":{"ru":"Лесенка прерывается коротким джамптриллом [12][34], потом снова идёт вправо. Надо переключиться со ската на чередование рук и обратно.","en":"The staircase is cut by a short [12][34] jumptrill, then runs right again. You have to switch from sliding to alternating hands and back."},"rows":"12 3 4 1 23 4 12 34 12 34 1 23 4"},{"name":{"ru":"Переход в ролл","en":"Fading into a roll"},"note":{"ru":"Сначала лесенки с джампами, потом джампы пропадают, а движение вправо остаётся. Дальше идёт обычный ролл 1 2 3 4.","en":"First staircases with jumps, then the jumps drop out while the rightward motion stays. What's left is a plain 1 2 3 4 roll."},"rows":"12 3 4 1 23 4 1 2 3 4 1 2 3 4"}],"also":[{"fam":"handstream","note":{"ru":"Хенды тоже скатываются: хенд, а за ним ноты лесенкой.","en":"Hands roll out too: a hand, then notes going down a staircase."}},{"fam":"tech","note":{"ru":"На быстрых снапах дампы похожи на грейс-ноты.","en":"At fast snaps, dumps look like grace notes."}}],"vs":{"ru":"<b>Роллы<\/b> — та же лесенка, но без джампов. В обычном <b>джампстриме<\/b> ноты не идут в одну сторону. Слово «дампстрим» разные игроки понимают не совсем одинаково: здесь так назван джампстрим, который идёт лесенкой.","en":"<b>Rolls<\/b> are the same staircase without jumps. In normal <b>jumpstream<\/b> the notes don't run in one direction. Players don't all use the word \"dumpstream\" the same way: here it means jumpstream that runs as a staircase."},"related":["Rolls","Jumpstream","Grace notes"]},{"en":"Handstream","fam":"handstream","base":true,"ru":"Хендстрим","level":2,"skill":["Handstream","Stamina"],"def":{"ru":"Стрим, где вперемешку стоят хенды (три ноты сразу), джампы и одиночные ноты.","en":"A stream mixing hands (three notes at once), jumps and single notes."},"simple":{"ru":"Это джампстрим, в который добавили хенды: иногда ты жмёшь сразу три клавиши. Одна рука при этом берёт два пальца, а другая один. Выглядит плотно, но руки всё так же работают по очереди. Вместе с джампстримом его ещё называют чордстримом.","en":"It is jumpstream with hands added: sometimes you press three keys at once. One hand takes two fingers and the other takes one. It looks dense, but the hands still take turns. Together with jumpstream it is also called chordstream."},"howto":{"ru":["Читай хенд по пустой колонке: заметить, какой колонки нет, быстрее, чем считать три ноты.","После хенда без джеков (повторов колонки) следующей может быть только та колонка, которой в хенде не было.","Держи ровный счёт: хенды звучат плотнее, но стоят в том же ритме, что и остальные ноты.","Расслабляй руки между хендами, не держи пальцы прижатыми к клавишам."],"en":["Read a hand by its empty column: spotting which column is missing is faster than counting three notes.","After a hand, with no jacks (repeated columns), the next note can only be the column the hand left out.","Keep an even count: hands sound heavier but sit in the same rhythm as the other notes.","Relax your hands between the hands; don't keep your fingers pressed down."]},"mistakes":{"ru":["Три ноты хенда жмутся не вместе.","Ты зажимаешь руки на плотном куске и быстро устаёшь.","Видишь хенд, замираешь на мгновение и теряешь ритм."],"en":["The three notes of a hand don't land together.","You tense up on a dense section and tire quickly.","You see a hand, freeze for a moment and lose the rhythm."]},"practice":{"ru":"Сначала освой джампстрим: хендстрим строится на нём. Потом бери лёгкие карты с хендстримом или снижай рейт. Следи, чтобы хенды не размазывались, и только потом поднимай скорость.","en":"Learn jumpstream first: handstream is built on it. Then pick easy handstream maps or lower the rate. Make sure the hands don't smear, and only then raise the speed."},"variants":[{"name":{"ru":"Классический","en":"Classic"},"note":{"ru":"Хенды, джампы и одиночные ноты вперемешку, хенд раз в несколько строк.","en":"Hands, jumps and single notes mixed, with a hand every few rows."},"rows":"124 3 12 4 23 1 234 1 34 2 134 2"},{"name":{"ru":"Лёгкий хендстрим","en":"Light handstream"},"note":{"ru":"Хенды редкие, между ними одиночные ноты и джампы. Хороший первый шаг после джампстрима.","en":"Hands are rare, with single notes and jumps between them. A good first step after jumpstream."},"rows":"123 4 1 3 24 1 3 2 134 2 1 3"},{"name":{"ru":"Со сменой снапа","en":"With a snap change"},"note":{"ru":"Начало на 1/4, потом ритм переходит на 1/3. Хенды на новом снапе легко сыграть не вовремя.","en":"It starts at 1/4, then the rhythm moves to 1/3. Hands on the new snap are easy to play off time."},"rows":"124 3 12 4 23 1 234 1 34","t":[0,1,2,3,4,5.333,6.667,8,9.333],"fam":"tech"},{"name":{"ru":"Близко к чордджеку","en":"Close to chordjack"},"note":{"ru":"Аккорды стоят вплотную и делят колонки, появляются джеки. Это уже чордджек, и играется он по-другому.","en":"The chords sit right next to each other and share columns, so jacks appear. This is chordjack now, and it plays differently."},"rows":"124 13 24 123 4 12 34 124","fam":"chordjack"},{"name":{"ru":"С бёрстом на 1/8","en":"With a 1/8 burst"},"note":{"ru":"Между джампом и хендом стоят три быстрые одиночные ноты на 1/8. После них сразу хенд, так что разгоняться и собирать руку надо почти одновременно.","en":"Three fast single 1/8 notes sit between a jump and a hand. A hand comes right after them, so you speed up and gather the whole hand almost at once."},"rows":"124 3 12 4 23 1 4 2 134 2 13 4","t":[0,1,2,3,4,4.5,5,5.5,6,7,8,9]},{"name":{"ru":"Джампстрим перерастает в хендстрим","en":"Jumpstream growing into handstream"},"note":{"ru":"Начинается чистый джампстрим, потом появляются хенды, и к концу они стоят всё чаще. Хорошо показывает, где кончается одно и начинается другое.","en":"It starts as pure jumpstream, then hands appear and come more and more often towards the end. It shows well where one ends and the other begins."},"rows":"12 3 24 1 34 2 13 4 123 4 12 3 124 3 2 134"},{"name":{"ru":"Только хенды и одиночные","en":"Hands and single notes only"},"note":{"ru":"Джампов нет вообще: хенд, три одиночные ноты, снова хенд. Между хендами пальцы бегут как в стриме.","en":"No jumps at all: a hand, three single notes, another hand. Between the hands the fingers run like in a stream."},"rows":"123 4 1 2 134 2 1 3 124 3 2 4 123"},{"name":{"ru":"С разнесёнными джампами","en":"With split jumps"},"note":{"ru":"Все джампы между хендами разнесённые: [14] и [13]. Каждый аккорд берёт ноты у обеих рук, ни одна рука не отдыхает.","en":"Every jump between the hands is split: [14] and [13]. Each chord takes notes from both hands, so neither hand rests."},"rows":"124 3 14 2 13 4 123 4 13 2 14 3"},{"name":{"ru":"Медленный, на 1/3","en":"Slow, at 1/3"},"note":{"ru":"Хендстрим с тремя нотами на удар. Темп ниже, и есть время собрать каждый хенд — хороший способ разучить форму.","en":"Handstream at three notes per beat. The pace is lower, so there's time to gather each hand — a good way to learn the shape."},"rows":"234 1 34 2 13 4 12 3 124 3 14 2","t":[0,1.333,2.667,4,5.333,6.667,8,9.333,10.667,12,13.333,14.667]}],"also":[{"fam":"jumpstream","note":{"ru":"Джампстрим с редкими хендами — это уже лёгкий хендстрим.","en":"Jumpstream with a few hands is already light handstream."}},{"fam":"chordjack","note":{"ru":"Когда аккорды начинают делить колонки, хендстрим переходит в чордджек.","en":"When the chords start sharing columns, handstream turns into chordjack."}},{"fam":"tech","note":{"ru":"В техе хендстрим часто меняет снап.","en":"In tech, handstream often changes snap."}}],"vs":{"ru":"В <b>джампстриме<\/b> максимум две ноты сразу. В <b>чордджеке<\/b> колонки повторяются из аккорда в аккорд, а в хендстриме почти не повторяются.","en":"<b>Jumpstream<\/b> has two notes at once at most. In <b>chordjack<\/b> columns repeat from chord to chord; in handstream they almost never repeat in a row."},"related":["Jumpstream","Dense handstream","Jumpy handstream","Chordjack"]},{"en":"Chord trills","fam":"handstream","base":false,"ru":"Чорд-триллы","level":2,"skill":["Handstream","Technical"],"def":{"ru":"Хенд чередуется с единственной нотой, которой в нём нет: [123] 4 [123] 4.","en":"A hand alternates with the one note it leaves out: [123] 4 [123] 4."},"simple":{"ru":"Это трилл, у которого одна сторона — целый аккорд. Хенд и одиночная нота идут по очереди. Звучит как тяжёлый ровный ритм: бум-тук, бум-тук.","en":"It is a trill where one side is a whole chord. The hand and the single note take turns. It sounds like a heavy, even beat: boom-tick, boom-tick."},"howto":{"ru":["В [123] 4 правая рука триллит указательным (3) и средним (4), а левая бьёт джамп [12] только на хенде вместе с нотой 3.","Думай о нём как о трилле на одной руке плюс ровный стук другой рукой.","Чтобы сменить хенд, нужна переходная нота. Увидь её заранее.","Не дави хенд сильнее, чем одиночную ноту, иначе ритм начнёт хромать."],"en":["In [123] 4 the right hand trills with the index (3) and middle (4) finger, while the left hand plays the jump [12] only on the hand, together with the 3.","Think of it as a trill on one hand plus a steady tap with the other.","Changing to another hand takes a linking note. Spot it early.","Don't press the hand harder than the single note, or the rhythm starts to limp."]},"mistakes":{"ru":["Хенд размазывается, потому что рука с джампом опаздывает.","Ты ускоряешься, как на обычном трилле.","Ты пропускаешь переходную ноту при смене хенда."],"en":["The hand smears because the hand playing the jump comes late.","You speed up like on a normal trill.","You miss the linking note when the hand changes."]},"practice":{"ru":"Начни с одного вида, например [123] 4, на сниженном рейте. Потом попробуй зеркальный [234] 1 и куски, где хенд меняется. Следи, чтобы хенд и одиночная нота шли через одинаковые промежутки.","en":"Start with one kind, for example [123] 4, at a lower rate. Then try the mirror [234] 1 and sections where the hand changes. Check that the hand and the single note are evenly spaced."},"variants":[{"name":{"ru":"Классический","en":"Classic"},"note":{"ru":"Хенд слева, одиночная нота у правого среднего пальца.","en":"The hand on the left, the single note on the right middle finger."},"rows":"123 4 123 4 123 4 123 4"},{"name":{"ru":"Зеркальный","en":"Mirrored"},"note":{"ru":"Хенд справа, одиночная нота у левого среднего пальца. Трилл теперь на левой руке.","en":"The hand on the right, the single note on the left middle finger. The trill is now on the left hand."},"rows":"234 1 234 1 234 1 234 1"},{"name":{"ru":"Со сменой хенда","en":"With hand changes"},"note":{"ru":"Хенд меняется через переходную ноту или джамп, иначе вышел бы джек.","en":"The hand changes through a linking note or jump, otherwise there would be a jack."},"rows":"123 4 123 4 12 3 124 3 124 3 2 134 2 134"},{"name":{"ru":"С джампом вместо хенда","en":"With a jump instead of a hand"},"note":{"ru":"Джамп чередуется с одной нотой. В джампстриме это обычный кусок.","en":"A jump alternates with one note. In jumpstream this is a common piece."},"rows":"12 3 12 3 14 2 14 2 34 1 34 1","fam":"jumpstream"},{"name":{"ru":"Быстрый кусок","en":"Fast burst"},"note":{"ru":"Чорд-трилл ускоряется до 1/6 после ритма 1/4. Нужна очень лёгкая рука.","en":"The chord trill speeds up to 1/6 after 1/4 rhythm. It needs a very light hand."},"rows":"123 4 123 4 123 4","t":[0,1,2,2.667,3.333,4],"fam":"tech"},{"name":{"ru":"Хенд [124], нота 3","en":"Hand [124], note 3"},"note":{"ru":"Одиночная нота теперь внутри, на колонке 3. Правая рука триллит между 4 в хенде и 3 одиночной, а левая жмёт [12] через строку.","en":"The single note is now on the inside, on column 3. The right hand trills between 4 in the hand and the single 3, while the left presses [12] every other row."},"rows":"124 3 124 3 124 3 124 3 124 3"},{"name":{"ru":"Хенд [134], нота 2, с ускорением","en":"Hand [134], note 2, speeding up"},"note":{"ru":"Одиночная нота на колонке 2, и трилл ускоряется с 1/2 до 1/8. Левая рука триллит 1–2, правая держит пару [34].","en":"The single note is on column 2, and the trill speeds up from 1/2 to 1/8. The left hand trills 1–2 while the right keeps the [34] pair."},"rows":"134 2 134 2 134 2 134 2 134 2","t":[0,2,3,4,5,6,6.5,7,7.5,8]},{"name":{"ru":"Переход в джамптрилл","en":"Turning into a jumptrill"},"note":{"ru":"Хенд теряет ноту, а одиночная получает соседа: [123] 4 становится [12] [34]. Нагрузка выравнивается между руками.","en":"The hand loses a note and the single gains a neighbour: [123] 4 becomes [12] [34]. The load evens out between the hands."},"rows":"123 4 123 4 123 4 12 34 12 34 12 34"},{"name":{"ru":"С неполным хендом","en":"With a broken hand"},"note":{"ru":"В середине один хенд превращается в джамп [13]. Это брейк: палец на колонке 2 должен один раз не нажать.","en":"In the middle, one hand turns into a [13] jump. It's a break: the finger on column 2 has to skip one press."},"rows":"123 4 123 4 13 4 123 4 123 4"},{"name":{"ru":"Парами на 1/8","en":"In pairs at 1/8"},"note":{"ru":"Хенд и одиночная нота идут вплотную на 1/8, потом пауза. Каждая пара похожа на хенд с быстрым «хвостиком».","en":"The hand and the single note come close together at 1/8, then a pause. Each pair looks like a hand with a quick tail."},"rows":"123 4 123 4 123 4 123 4","t":[0,0.5,2,2.5,4,4.5,6,6.5]}],"also":[{"fam":"jumpstream","note":{"ru":"С джампом вместо хенда: джамп чередуется с одной нотой.","en":"With a jump instead of a hand: a jump alternates with one note."}},{"fam":"tech","note":{"ru":"Короткие быстрые чорд-триллы встречаются в техе как вставки.","en":"Short fast chord trills show up in tech as inserts."}}],"vs":{"ru":"<b>Джамптрилл<\/b> — джампы двумя руками по очереди ([12][34]). В чорд-трилле одна сторона — хенд, а другая всего одна нота.","en":"A <b>jumptrill<\/b> is jumps with the hands taking turns ([12][34]). In a chord trill one side is a hand and the other is a single note."},"related":["Trills","Jumptrill","Split trill","Handstream"]},{"en":"Dense handstream","fam":"handstream","base":false,"ru":"Плотный хендстрим","level":3,"skill":["Handstream","Stamina"],"def":{"ru":"Хендстрим, где хенды и джампы идут почти без передышки, а одиночных нот мало.","en":"Handstream where hands and jumps come almost without a break, with few single notes."},"simple":{"ru":"Хенды и джампы идут один за другим, а одиночные ноты нужны только как связки. Экран кажется забитым нотами, а пальцы почти не отдыхают. Такой кусок сильно грузит выносливость.","en":"Hands and jumps follow one another, and single notes are only links between them. The screen looks packed with notes and your fingers barely rest. A section like this is very hard on stamina."},"howto":{"ru":["После хенда смотри на пустую колонку: без джеков следующая нота может стоять только там.","Не читай каждую ноту по отдельности. Читай группами: хенд, нота, джамп.","Расслабляй плечи и дыши: плотные куски длинные, и зажатые руки сдаются первыми.","Бей легко и с маленькой высоты, чтобы хватило сил до конца куска."],"en":["After a hand, look at the empty column: with no jacks, the next note can only be there.","Don't read every note one by one. Read in groups: hand, note, jump.","Relax your shoulders and breathe: dense sections are long and tense hands give out first.","Hit lightly and from a small height so you have strength left at the end."]},"mistakes":{"ru":["Хенды размазываются, когда руки устают.","Ты зажимаешься и начинаешь отставать от музыки.","Ты играешь на силе, а не на ритме."],"en":["The hands smear as your arms get tired.","You tense up and fall behind the music.","You play with force instead of rhythm."]},"practice":{"ru":"Сначала уверенно играй обычный хендстрим. Плотный хендстрим тренируй короткими кусками на сниженном рейте, потом удлиняй их. Если точность падает к концу куска, это выносливость: играй больше длинных карт полегче.","en":"First get comfortable with normal handstream. Train dense handstream in short pieces at a lower rate, then make them longer. If accuracy drops near the end of a section, that is stamina: play more long, easier maps."},"variants":[{"name":{"ru":"Классический","en":"Classic"},"note":{"ru":"Хенды и джампы друг за другом, одиночные ноты только как связки. Форма хенда всё время меняется.","en":"Hands and jumps one after another, with single notes only as links. The hand shape keeps changing."},"rows":"123 4 12 34 1 234 1 34 2 134 2 13"},{"name":{"ru":"С джамптриллами","en":"With jumptrills"},"note":{"ru":"Между хендами стоят джамптриллы, одиночных нот почти нет.","en":"Jumptrills sit between the hands, with almost no single notes."},"rows":"123 4 12 34 12 3 124 3 12 34 1 234"},{"name":{"ru":"Нагрузка на правую руку","en":"Right-hand heavy"},"note":{"ru":"Почти все хенды и джампы берут два пальца правой руки, поэтому устаёт именно она.","en":"Almost every hand and jump takes two fingers of the right hand, so that is the hand that tires."},"rows":"234 1 34 2 134 2 34 1 234 1 3 124"},{"name":{"ru":"Переход в чордджек","en":"Turning into chordjack"},"note":{"ru":"Аккорды стоят вплотную и делят колонки. Это уже чордджек, и играть его нужно по-другому.","en":"The chords sit back to back and share columns. This is chordjack now, and it needs a different approach."},"rows":"123 34 12 234 14 123 24 134","fam":"chordjack"},{"name":{"ru":"Хенды с дыркой в середине","en":"Hands with a gap in the middle"},"note":{"ru":"Хенды [124] и [134] через две строки, между ними внутренние колонки 2 и 3 по одной. Крайние колонки 1 и 4 жмутся почти как анкор.","en":"Hands [124] and [134] every third row, with the inner columns 2 and 3 as single notes between them. The edge columns 1 and 4 get pressed almost like an anchor."},"rows":"124 3 2 134 2 3 124 3 2 134 2 3"},{"name":{"ru":"С ускорением до 1/6","en":"Speeding up to 1/6"},"note":{"ru":"Первая половина на 1/4, вторая на 1/6. Хенды остаются такими же плотными, но собирать их приходится быстрее.","en":"The first half is at 1/4, the second at 1/6. The hands stay just as dense, but you have to gather them faster."},"rows":"234 1 23 4 123 4 12 3 124 3 14 2","t":[0,1,2,3,4,5,6,6.667,7.333,8,8.667,9.333]},{"name":{"ru":"Переход в чорд-трилл","en":"Settling into a chord trill"},"note":{"ru":"После смены хендов форма застывает: [123] и 4 по очереди. Руки перестают перестраиваться и просто держат один трилл.","en":"After the changing hands, the shape freezes: [123] and 4 in turn. The hands stop reshaping and just hold one trill."},"rows":"124 3 12 4 123 4 123 4 123 4"},{"name":{"ru":"Короткая плотная вставка","en":"Short dense burst"},"note":{"ru":"Обычный стрим, потом несколько хендов почти вплотную, потом снова стрим. Надо быстро перейти от игры пальцами к нажатиям всей рукой и обратно.","en":"Plain stream, then a few hands almost back to back, then stream again. You have to switch fast from finger work to whole-hand presses and back."},"rows":"1 3 2 4 123 4 3 124 3 2 134 2 3 1"},{"name":{"ru":"Длинный забег","en":"Long run"},"note":{"ru":"Длинный кусок, где хенд стоит каждые несколько строк и всё время меняет форму. Проверяет выносливость рук, а не одну сложную строку.","en":"A long piece with a hand every few rows, always changing shape. It tests the stamina of the hands rather than one hard row."},"rows":"123 4 3 124 3 2 134 2 14 3 12 4 123 4 23 1 234 1 34 2"}],"also":[{"fam":"chordjack","note":{"ru":"Если хенды встают вплотную друг к другу, начинаются джеки, и это уже чордджек.","en":"When the hands sit right next to each other, jacks appear and it becomes chordjack."}}],"vs":{"ru":"В <b>джампи-хендстриме<\/b> хендов меньше, а джампов больше. В <b>чордджеке<\/b> аккорды делят колонки, а здесь колонки почти не повторяются подряд.","en":"<b>Jumpy handstream<\/b> has fewer hands and more jumps. In <b>chordjack<\/b> the chords share columns; here columns almost never repeat in a row."},"related":["Handstream","Jumpy handstream","Handjack","Quadstream"]},{"en":"Jumpy handstream","fam":"handstream","base":false,"ru":"Джампи-хендстрим","level":2,"skill":["Handstream","Jumpstream"],"def":{"ru":"Хендстрим, где джампов больше, чем хендов, а между аккордами стоят одиночные ноты.","en":"Handstream with more jumps than hands and single notes between the chords."},"simple":{"ru":"Это что-то среднее между джампстримом и хендстримом. Почти всё время ты жмёшь джампы, а иногда вместо джампа выпадает хенд. Руки работают по очереди, как в джампстриме.","en":"It sits between jumpstream and handstream. Most of the time you press jumps, and now and then a hand comes in place of a jump. The hands take turns, as in jumpstream."},"howto":{"ru":["Играй его как джампстрим, а хенд считай джампом с одной лишней нотой.","Смотри, на какую руку падает лишняя нота хенда: эта рука в этот момент жмёт двумя пальцами.","Держи счёт по джампам и хендам, одиночные ноты между ними просто заполняют ритм.","Не тормози перед хендом: он стоит в том же ритме, что и джампы."],"en":["Play it like jumpstream and treat a hand as a jump with one extra note.","Watch which hand gets the extra note: that hand presses with two fingers at that moment.","Keep count with the jumps and hands; the single notes between them just fill the rhythm.","Don't slow down before a hand: it sits in the same rhythm as the jumps."]},"mistakes":{"ru":["Хенд неожиданно сбивает тебя, и ты теряешь ритм на следующих нотах.","Третью ноту хенда ты пропускаешь или жмёшь позже двух других.","Ты ускоряешься на одиночных нотах."],"en":["A hand catches you off guard and you lose the rhythm on the next notes.","You miss the third note of a hand or press it after the other two.","You speed up on the single notes."]},"practice":{"ru":"Начни с уверенного джампстрима, потом бери карты, где хендов немного. Играй на сниженном рейте, пока хенды не перестанут сбивать. Потом постепенно добавляй скорость и длину кусков.","en":"Start from solid jumpstream, then pick maps with only a few hands. Play at a lower rate until the hands stop throwing you off. Then slowly add speed and longer sections."},"variants":[{"name":{"ru":"Классический","en":"Classic"},"note":{"ru":"В основном джампы, а хенд выпадает пару раз на кусок.","en":"Mostly jumps, with a hand coming in a couple of times per section."},"rows":"123 4 12 3 24 1 3 124 3 14 2 34"},{"name":{"ru":"Хенды и джампы по очереди","en":"Hands and jumps taking turns"},"note":{"ru":"Хенд, нота, джамп, нота, и так по кругу. Самая ровная форма.","en":"Hand, note, jump, note, and around again. The most even shape."},"rows":"123 4 12 3 124 3 14 2 134 2 13 4"},{"name":{"ru":"С джамптриллами и сплитами","en":"With jumptrills and splits"},"note":{"ru":"Между хендами стоят короткие джамптриллы и сплит-триллы, и форму рук нужно менять быстро.","en":"Short jumptrills and split trills sit between the hands, so the hand shape has to change quickly."},"rows":"123 4 12 34 12 3 24 13 24 1 234 1"},{"name":{"ru":"Почти джампстрим","en":"Almost jumpstream"},"note":{"ru":"Хенд всего один на целый кусок. Многие игроки назовут это просто джампстримом.","en":"Just one hand in the whole section. Many players would call it plain jumpstream."},"rows":"12 3 24 1 34 2 13 4 123 4 12 3","fam":"jumpstream"},{"name":{"ru":"Джампы только левой рукой","en":"Left-hand jumps only"},"note":{"ru":"Все джампы — [12], а хенды — [123] и [124]. Левая рука жмёт свою пару в каждом аккорде, правая чередует 3 и 4.","en":"Every jump is [12], and the hands are [123] and [124]. The left hand presses its pair in every chord while the right alternates 3 and 4."},"rows":"123 4 12 3 124 3 12 4 123 4 12 3"},{"name":{"ru":"Анкор на колонке 3","en":"Anchor on column 3"},"note":{"ru":"Колонка 3 стоит почти в каждом аккорде через строку. Указательный правой руки устаёт быстрее остальных.","en":"Column 3 sits in almost every chord, every other row. The right index finger tires faster than the others."},"rows":"123 4 23 1 34 2 13 4 23 1 234 1","hl":[3]},{"name":{"ru":"Внутренние джампы [23]","en":"Inner jumps [23]"},"note":{"ru":"Большинство джампов на двух центральных колонках. Внутренние пальцы работают вместе, а крайние чаще берут одиночные ноты.","en":"Most jumps sit on the two middle columns. The inner fingers work together while the outer ones mostly take single notes."},"rows":"234 1 23 4 123 4 23 1 23 4 12 3"},{"name":{"ru":"Аккорды уходят в ролл","en":"Chords dropping into a roll"},"note":{"ru":"После хендов и джампов аккорды пропадают, и остаётся ролл 2 3 4 1 2 3 4. Руки отпускают аккорды и бегут по колонкам по одной.","en":"After the hands and jumps, the chords drop out and a 2 3 4 1 2 3 4 roll is left. The hands let go of chords and run over the columns one at a time."},"rows":"123 4 12 3 124 3 14 2 3 4 1 2 3 4"},{"name":{"ru":"С куском на 1/6","en":"With a 1/6 piece"},"note":{"ru":"В середине пять строк на 1/6, потом снова 1/4. Так джампи-хендстрим выглядит в техе: смена снапа прямо посреди аккордов.","en":"Five rows in the middle are at 1/6, then it goes back to 1/4. This is how jumpy handstream looks in tech: a snap change right among the chords."},"rows":"123 4 12 3 24 1 34 2 134 2 13 4","t":[0,1,2,3,3.667,4.333,5,5.667,6.333,7.333,8.333,9.333],"fam":"tech"}],"also":[{"fam":"jumpstream","note":{"ru":"Когда хендов остаётся совсем мало, это обычный джампстрим.","en":"With very few hands left, it is plain jumpstream."}},{"fam":"tech","note":{"ru":"В техе джампи-хендстрим часто меняет снап посреди куска, например с 1/4 на 1/6 и обратно.","en":"In tech, jumpy handstream often changes snap mid-section, for example from 1/4 to 1/6 and back."}}],"vs":{"ru":"В <b>плотном хендстриме<\/b> хендов намного больше. В <b>джампстриме<\/b> хендов нет совсем.","en":"<b>Dense handstream<\/b> has many more hands. <b>Jumpstream<\/b> has no hands at all."},"related":["Jumpstream","Handstream","Dense handstream"]},{"en":"Chordjack","fam":"chordjack","base":true,"ru":"Чордджек","level":2,"skill":["Chordjack"],"def":{"ru":"Аккорды идут строка за строкой, и в каждом новом аккорде повторяется хотя бы одна колонка из прошлого.","en":"Chords come row after row, and each new chord repeats at least one column of the last one."},"simple":{"ru":"Одиночных нот почти нет: падают сплошные джампы и хенды. Часть пальцев бьёт ту же клавишу второй раз подряд, а остальные меняются. Ощущается как тяжёлый барабанный бит.","en":"There are almost no single notes: jumps and hands fall one after another. Some fingers hit the same key a second time in a row while the others change. It feels like a heavy drum beat."},"howto":{"ru":["Читай каждый аккорд целиком, как одну фигуру. Так быстрее, чем разбирать его по нотам.","Держи все четыре пальца на клавишах, тогда их не придётся искать.","После каждого нажатия отпускай клавишу до конца. Зажатая клавиша не засчитает следующую ноту на той же колонке.","Найди колонку, которая повторяется: это джек внутри аккордов, на неё уходит больше всего сил.","Бей мягко, помогая запястьем, и не зажимай пальцы."],"en":["Read each chord whole, as one shape. That is faster than taking it apart note by note.","Keep all four fingers on the keys so you never have to look for them.","Release every key fully after each hit. A key you keep half pressed won't register the next note in that column.","Spot the column that repeats: that is the jack inside the chords, and it takes the most effort.","Hit softly, let the wrist help, and don't clench your fingers."]},"mistakes":{"ru":["Нажимать ноты аккорда не одновременно. Точность падает, даже если ничего не пропущено.","Зажимать руку. Через несколько секунд она устаёт и начинает отставать.","Читать каждую ноту отдельно и из-за этого терять ритм."],"en":["Pressing the notes of a chord at slightly different times. Accuracy drops even when nothing is missed.","Tensing the hand. After a few seconds it tires and starts to lag behind.","Reading every note separately and losing the rhythm because of it."]},"practice":{"ru":"Возьми медленный чордджек или поставь рейт 0.8–0.9 (скорость песни). Сначала добейся, чтобы все ноты аккорда звучали вместе, и только потом поднимай скорость. Следи, чтобы рука оставалась расслабленной до конца отрезка.","en":"Pick slow chordjack or set the rate to 0.8–0.9 (song speed). First make every chord sound as one hit, and only then raise the speed. Check that your hand stays relaxed to the end of the section."},"variants":[{"name":{"ru":"Классика","en":"Classic"},"note":{"ru":"Хенды и джампы вперемешку. Одна-две колонки повторяются из аккорда в аккорд.","en":"Hands and jumps mixed. One or two columns repeat from chord to chord."},"rows":"123 234 12 124 34 134 23 123 14 124"},{"name":{"ru":"Лёгкий, только джампы","en":"Light, jumps only"},"note":{"ru":"Аккорды из двух нот. Хорошее начало: джеки есть, но рукам легче.","en":"Two-note chords only. A good start: the jacks are there, but it is easier on the hands."},"rows":"12 13 23 24 34 13 12 24 14 34"},{"name":{"ru":"С анкором","en":"With an anchor"},"note":{"ru":"Колонка 1 есть почти в каждом аккорде. Вся нагрузка ложится на один палец.","en":"Column 1 is in almost every chord. One finger takes most of the load."},"rows":"12 13 124 1 13 12 134 13","hl":[1]},{"name":{"ru":"Внутри хендстрима","en":"Inside handstream"},"note":{"ru":"Хенды стоят почти вплотную, между ними одна нота, и она повторяется в следующем хенде.","en":"The hands sit almost back to back with one note between them, and that note repeats in the next hand."},"rows":"123 4 124 3 134 2 234 1","fam":"handstream"},{"name":{"ru":"Как джеки","en":"As jacks"},"note":{"ru":"Аккорд держится два раза подряд, потом сдвиг. Здесь чордджек ближе всего к обычным джекам.","en":"Each chord is hit twice, then it moves. This is where chordjack is closest to plain jacks."},"rows":"12 12 124 124 34 34 134 134","fam":"jack"},{"name":{"ru":"2/4: джампы и квады","en":"2/4: jumps and quads"},"note":{"ru":"Джамп, квад, джамп, квад. Квад берёт все колонки, поэтому обе ноты джампа повторяются на каждой строке: джек сразу двумя пальцами. На квадах работает вся рука, и она быстро устаёт. Игроки зовут это «чордджек 2/4».","en":"Jump, quad, jump, quad. The quad takes every column, so both notes of the jump repeat on every row: a jack with two fingers at once. The quads work the whole hand, and it tires fast. Players call this a 2/4 chordjack."},"rows":"12 1234 34 1234 23 1234 14 1234"},{"name":{"ru":"2/4 с повторами","en":"2/4 with repeats"},"note":{"ru":"Тот же 2/4, но каждый аккорд звучит дважды. Два квада подряд — это уже короткий квадджек, так что руке почти некогда отдохнуть.","en":"The same 2/4, but every chord sounds twice. Two quads in a row are already a short quadjack, so the hand gets almost no rest."},"rows":"12 12 1234 1234 34 34 1234 1234"},{"name":{"ru":"Анкор на третьей","en":"Anchor on column 3"},"note":{"ru":"Каждый аккорд содержит третью колонку, поэтому один палец правой руки бьёт джек всю дорогу. Остальные ноты меняются вокруг него.","en":"Every chord includes column 3, so one finger of the right hand jacks the whole time. The other notes change around it."},"rows":"34 23 134 13 234 23 123 34 13 234","hl":[3]},{"name":{"ru":"Левая рука на месте","en":"Left hand stays"},"note":{"ru":"Левая рука в каждой строке бьёт [12] — это джампджек, а правая скачет между 3 и 4. Две руки делают разную работу.","en":"The left hand hits [12] in every row as a jumpjack, while the right hand switches between 3 and 4. The two hands do different jobs."},"rows":"123 124 12 123 124 123 12 124 123 124"},{"name":{"ru":"Разгон в середине","en":"Burst in the middle"},"note":{"ru":"Аккорды идут на 1/2, потом пять строк подряд на 1/4 и снова медленно. Не зажимайся перед ускорением и не спеши после него.","en":"Chords come at 1/2, then five rows in a row at 1/4, then slow again. Stay loose before the burst and don't rush after it."},"rows":"12 123 23 234 34 134 14 124 12 123","t":[0,2,4,6,7,8,9,10,12,14]},{"name":{"ru":"Рваная цепь","en":"Broken chain"},"note":{"ru":"Два раза цепь рвётся: нота встаёт на колонку, которой не было в прошлом аккорде. На таком месте легко сбиться, потому что пальцы ждут повтора.","en":"The chain breaks twice: a note lands on a column the last chord didn't have. It's easy to stumble there because your fingers expect a repeat."},"rows":"123 23 234 1 134 13 124 3 23 234"},{"name":{"ru":"Переход в джамптрилл","en":"Into a jumptrill"},"note":{"ru":"Сначала чордджек, потом джампы перестают повторяться и чередуются [12] и [34]. Руки переключаются с повторов на попеременные удары.","en":"It starts as chordjack, then the jumps stop repeating and alternate [12] and [34]. Your hands switch from repeats to taking turns."},"rows":"123 13 134 34 234 12 34 12 34 12"}],"also":[{"fam":"handstream","note":{"ru":"Когда хенды в хендстриме стоят слишком плотно, колонки начинают повторяться, и это уже чордджек.","en":"When the hands in handstream get very dense, columns start to repeat, and that is chordjack."}},{"fam":"jack","note":{"ru":"Каждая повторяющаяся колонка в чордджеке — это джек, только внутри аккордов.","en":"Every repeating column in chordjack is a jack, just inside chords."}}],"vs":{"ru":"<b>Хендстрим<\/b> тоже состоит из аккордов, но между ними стоят одиночные ноты и колонки почти не повторяются. В чордджеке аккорды идут вплотную и колонки повторяются.","en":"<b>Handstream<\/b> is made of chords too, but single notes sit between them and columns rarely repeat. In chordjack the chords come back to back and columns repeat."},"related":["Handjack","Jumpjack","Quadhand","Gluts","Jack"]},{"en":"Handjack","fam":"chordjack","ru":"Хендджеки","level":3,"skill":["Chordjack"],"def":{"ru":"Хенды (аккорды из трёх нот) идут подряд, и каждый следующий повторяет две колонки предыдущего.","en":"Hands (three-note chords) come in a row, and each one repeats two columns of the one before."},"simple":{"ru":"Три клавиши разом, снова три, снова три. Две из них ты бьёшь второй раз подряд, а третья меняется. Это очень плотно и быстро забивает руки.","en":"Three keys at once, then three again, then three again. You hit two of them a second time in a row while the third one changes. It is very dense and tires the hands fast."},"howto":{"ru":["Смотри только на ту колонку, которая меняется. Две другие просто повторяются.","Обе руки работают в каждой строке, так что держи их одинаково расслабленными.","Отпускай все три клавиши до конца перед следующим хендом.","Держи ровный счёт под музыку. На хендджеках легко начать спешить."],"en":["Watch only the column that changes. The other two just repeat.","Both hands play in every row, so keep them equally relaxed.","Release all three keys fully before the next hand.","Keep an even count with the music. Handjacks make it easy to start rushing."]},"mistakes":{"ru":["Недожимать одну ноту хенда, когда рука устаёт.","Спешить и нажимать хенды раньше времени.","Зажимать плечо и руку, из-за чего хенды становятся неровными."],"en":["Not pressing one note of the hand properly once the hand gets tired.","Rushing and hitting the hands too early.","Tensing the shoulder and arm, which makes the hands uneven."]},"practice":{"ru":"Возьми короткий отрезок с хендджеками и играй его на рейте 0.7–0.8. Цель — чистые хенды без потерянных нот. Когда получается, поднимай рейт по 0.05.","en":"Take a short section of handjacks and play it at 0.7–0.8 rate. The goal is clean hands with no dropped notes. When that works, raise the rate by 0.05."},"variants":[{"name":{"ru":"Классика","en":"Classic"},"note":{"ru":"Хенд за хендом, каждый раз меняется одна колонка.","en":"Hand after hand, one column changes each time."},"rows":"123 234 134 124 123 234 134 124"},{"name":{"ru":"Один хенд подряд","en":"Same hand repeated"},"note":{"ru":"Один и тот же хенд два-три раза подряд. Это чистый джек сразу на трёх колонках.","en":"The same hand two or three times in a row. That is a plain jack on three columns at once."},"rows":"123 123 123 234 234 234 124 124","fam":"jack"},{"name":{"ru":"С джампами","en":"With jumps"},"note":{"ru":"Между хендами стоят джампы. Руки чуть отдыхают, но джеки остаются.","en":"Jumps sit between the hands. The hands rest a little, but the jacks stay."},"rows":"123 23 234 34 134 14 124 12"},{"name":{"ru":"Внутри хендстрима","en":"Inside handstream"},"note":{"ru":"Два хенда вплотную посреди потока, потом одиночная нота и снова пара хендов.","en":"Two hands back to back in the middle of the flow, then a single note and another pair of hands."},"rows":"123 234 1 124 134 2 123 4","fam":"handstream"},{"name":{"ru":"Анкор на второй","en":"Anchor on column 2"},"note":{"ru":"Вторая колонка есть в каждом хенде, остальные две ноты меняются. Левый палец на второй колонке устаёт первым.","en":"Column 2 is in every hand, and the other two notes change. The left finger on column 2 gets tired first."},"rows":"123 124 234 123 124 234 123 124","hl":[2]},{"name":{"ru":"Зажатые крайние","en":"Locked outer columns"},"note":{"ru":"Колонки 1 и 4 бьются в каждой строке, а средняя нота чередуется между 2 и 3. Это двойной джек по краям с триллом внутри.","en":"Columns 1 and 4 are hit in every row, and the middle note alternates between 2 and 3. It's a double jack on the edges with a trill inside."},"rows":"124 134 124 134 124 134 124 134"},{"name":{"ru":"Зажатая середина","en":"Locked inner columns"},"note":{"ru":"Колонки 2 и 3 бьются в каждой строке, а крайние чередуются: [123], потом [234]. Внутренние пальцы делают джек без отдыха.","en":"Columns 2 and 3 are hit in every row, and the outer notes alternate: [123], then [234]. The inner fingers jack with no rest."},"rows":"123 234 123 234 123 234 123 234"},{"name":{"ru":"С разгоном","en":"Speeding up"},"note":{"ru":"Первые хенды идут на 1/2, потом тот же цикл ускоряется до 1/4. Держи силу удара одинаковой, когда темп растёт.","en":"The first hands come at 1/2, then the same cycle speeds up to 1/4. Keep the same strength on each hit as the speed goes up."},"rows":"123 234 134 124 123 234 134 124 123 234","t":[0,2,4,6,8,9,10,11,12,13]},{"name":{"ru":"Переход в джампджеки","en":"Into jumpjacks"},"note":{"ru":"После цикла хендов аккорды худеют до джампов, и каждый джамп звучит дважды. Плотность падает, но джеки остаются.","en":"After a cycle of hands the chords thin out to jumps, and each jump is played twice. The density drops but the jacks stay."},"rows":"123 234 134 124 12 12 34 34 13 13"}],"also":[{"fam":"jack","note":{"ru":"По сути это джеки сразу на двух-трёх колонках.","en":"In effect, jacks on two or three columns at once."}},{"fam":"handstream","note":{"ru":"В плотном хендстриме два хенда иногда стоят вплотную, и получается короткий хендджек.","en":"In dense handstream two hands sometimes sit back to back, which makes a short handjack."}}],"vs":{"ru":"<b>Квадхенд<\/b> добавляет квады, все четыре клавиши разом. В хендджеках аккорды не больше трёх нот.","en":"<b>Quadhand<\/b> adds quads, all four keys at once. In handjacks no chord has more than three notes."},"related":["Chordjack","Quadhand","Jumpjack","Dense handstream"]},{"en":"Jumpjack","fam":"chordjack","ru":"Джампджеки","level":2,"skill":["Chordjack","JackSpeed"],"def":{"ru":"Один и тот же джамп нажимается два раза или больше подряд, потом переходит на другие колонки.","en":"The same jump is hit two or more times in a row, then it moves to other columns."},"simple":{"ru":"Джамп — это две ноты сразу. В джампджеке ты бьёшь его дважды подряд теми же двумя пальцами и переходишь на другую пару. Звучит как «тук-тук», только двумя пальцами.","en":"A jump is two notes at once. In a jumpjack you hit it twice in a row with the same two fingers, then move to another pair. It sounds like a double knock, just with two fingers."},"howto":{"ru":["Если джамп на одной руке ([12] или [34]), оба пальца двигаются вместе, как одна широкая клавиша.","Если джамп на две руки ([14], [23], [13], [24]), каждая рука бьёт свою ноту. Двигай руки одинаково.","Отпускай обе клавиши полностью между нажатиями.","Смотри на следующий джамп заранее: переход на новую пару сложнее самого повтора."],"en":["If the jump is on one hand ([12] or [34]), both fingers move together like one wide key.","If the jump is split across hands ([14], [23], [13], [24]), each hand hits its own note. Move both hands the same way.","Release both keys fully between hits.","Look at the next jump early: moving to a new pair is harder than the repeat itself."]},"mistakes":{"ru":["Бить две ноты джампа не одновременно.","Оставлять клавишу чуть нажатой, и тогда второе нажатие не засчитывается.","Напрягать руку, когда джампджеков много подряд."],"en":["Hitting the two notes of the jump at different times.","Leaving a key slightly pressed, so the second hit doesn't count.","Tensing the hand when many jumpjacks come in a row."]},"practice":{"ru":"Играй джампджеки на пониженном рейте, пока оба нажатия каждого джампа не станут ровными. Проверь, что тебе даётся хуже, джампы на одной руке или на двух, и тренируй их отдельно.","en":"Play jumpjacks at a lower rate until both hits of every jump are even. Find out which is harder for you, one-hand jumps or split jumps, and train those on their own."},"variants":[{"name":{"ru":"Классика","en":"Classic"},"note":{"ru":"Каждый джамп ровно дважды, потом другая пара колонок.","en":"Each jump exactly twice, then another pair of columns."},"rows":"23 23 14 14 12 12 34 34 13 13"},{"name":{"ru":"Левая, правая","en":"Left, right"},"note":{"ru":"Две пары по очереди: левая рука, потом правая. Похоже на джамптрилл, только каждый джамп звучит дважды.","en":"Two pairs taking turns: left hand, then right hand. Like a jumptrill, except each jump sounds twice."},"rows":"12 12 34 34 12 12 34 34"},{"name":{"ru":"Тройной повтор","en":"Triple repeat"},"note":{"ru":"Каждый джамп три раза. Это уже длинный джек сразу на двух колонках.","en":"Each jump three times. That is already a long jack on two columns at once."},"rows":"12 12 12 34 34 34 13 13 13 24 24 24","fam":"jack"},{"name":{"ru":"Внутри джампстрима","en":"Inside jumpstream"},"note":{"ru":"Джамп повторяется дважды посреди потока, а вокруг идут одиночные ноты.","en":"A jump repeats twice in the middle of the flow, with single notes around it."},"rows":"12 12 3 4 23 1 4 13 13 2 4 1","fam":"jumpstream"},{"name":{"ru":"Крайние и середина","en":"Outer and inner jumps"},"note":{"ru":"Меняются только [14] и [23], каждый по два раза. В каждом джампе по одному пальцу с каждой руки.","en":"Only [14] and [23] swap, each twice. Every jump uses one finger from each hand."},"rows":"14 14 23 23 14 14 23 23 14 14"},{"name":{"ru":"Длинный джампджек","en":"Long jumpjack"},"note":{"ru":"Один джамп пять раз подряд, потом другой — тоже пять. Тут важна выносливость: удары не должны слабеть к концу.","en":"One jump five times in a row, then another one five times. This is about stamina: your hits shouldn't get weaker toward the end."},"rows":"13 13 13 13 13 24 24 24 24 24"},{"name":{"ru":"С анкором","en":"Anchored jumpjack"},"note":{"ru":"Первая колонка есть в каждом джампе, а вторая нота переезжает: 2, 3, 4 и обратно. Левый крайний палец бьёт джек всё время.","en":"Column 1 is in every jump, and the second note moves: 2, 3, 4 and back. The left outer finger jacks the whole time."},"rows":"12 12 13 13 14 14 13 13 12 12","hl":[1]},{"name":{"ru":"Быстрые пары на 1/6","en":"Quick 1/6 pairs"},"note":{"ru":"Каждый джамп дважды очень быстро (на 1/6), потом пауза до следующей пары. Нужен короткий двойной удар обоими пальцами.","en":"Each jump twice very fast (at 1/6), then a pause before the next pair. You need a short double tap with both fingers."},"rows":"12 12 34 34 23 23 14 14","t":[0,0.667,2,2.667,4,4.667,6,6.667]},{"name":{"ru":"Переход в джамптрилл","en":"Into a jumptrill"},"note":{"ru":"Сначала [12] и [34] по два раза, потом они чередуются каждую строку. Руки перестают повторять и начинают бить по очереди.","en":"First [12] and [34] twice each, then they alternate every row. Your hands stop repeating and start taking turns."},"rows":"12 12 34 34 12 34 12 34 12 34"}],"also":[{"fam":"jack","note":{"ru":"Джампджек — это джек на двух колонках сразу.","en":"A jumpjack is a jack on two columns at once."}},{"fam":"jumpstream","note":{"ru":"Внутри джампстрима это джамп, нажатый дважды посреди потока.","en":"Inside jumpstream, it is a jump hit twice in the middle of the flow."}},{"fam":"handstream","note":{"ru":"В хендстриме бывает джамп, нажатый дважды между хендами.","en":"In handstream, a jump can be hit twice between the hands."}}],"vs":{"ru":"<b>Джамптрилл<\/b> чередует джампы без повторов: [12][34][12][34]. В джампджеке каждый джамп звучит минимум дважды подряд. Если между джампами стоят квады ([12][1234][34][1234]), это <b>чордджек 2/4<\/b>: повторяются не сами джампы, а их колонки внутри квадов.","en":"A <b>jumptrill<\/b> alternates jumps with no repeats: [12][34][12][34]. In a jumpjack each jump sounds at least twice in a row. If quads sit between the jumps ([12][1234][34][1234]), it is a <b>2/4 chordjack<\/b>: what repeats is not the jump itself but its columns inside the quads."},"related":["Chordjack","Minijacks","Gluts","Jumptrill","Handjack"]},{"en":"Quadhand","fam":"chordjack","ru":"Квадхенд","level":3,"skill":["Chordjack"],"def":{"ru":"Квады (все четыре колонки сразу) вперемешку с хендами, и в каждой строке есть джек. Название не устоявшееся: игроки чаще говорят просто «чордджек» или «квадджек».","en":"Quads (all four columns at once) mixed with hands, with a jack in every row. The name isn't settled; players usually just say chordjack or quadjack."},"simple":{"ru":"Квад — это все четыре клавиши разом. В квадхенде квады и хенды идут плотно друг за другом, и почти все пальцы бьют почти каждую строку. Это один из самых тяжёлых видов чордджека.","en":"A quad is all four keys at once. In quadhand, quads and hands come close together, so almost every finger hits almost every row. It is one of the heaviest kinds of chordjack."},"howto":{"ru":["После квада любой аккорд даёт джек, ведь квад занял все колонки.","В хенде ищи глазами дырку, то есть колонку без ноты. Одну пустую колонку видно быстрее, чем три полных.","Держи все пальцы на клавишах и бей мягко всей рукой.","Не дави сильнее на квадах: сила удара на попадание не влияет, а руку утомляет."],"en":["After a quad, any chord makes a jack, because the quad took every column.","In a hand, look for the gap, the one column with no note. One empty column is quicker to see than three full ones.","Keep all fingers on the keys and hit softly with the whole hand.","Don't press harder on quads: force doesn't help you hit, it only tires the hand."]},"mistakes":{"ru":["Терять одну ноту хенда сразу после квада.","Зажиматься и сбиваться с ритма через пару секунд.","Отпускать клавиши квада не полностью."],"en":["Dropping one note of the hand right after a quad.","Tensing up and losing the rhythm after a couple of seconds.","Not releasing the quad keys fully."]},"practice":{"ru":"Начни с медленных карт с квадами или с рейта около 0.7. Играй короткие отрезки и делай паузы между ними. Скорость поднимай, только когда хенды после квадов звучат чисто.","en":"Start with slow maps that have quads, or a rate around 0.7. Play short sections with breaks between them. Raise the speed only when the hands after the quads come out clean."},"variants":[{"name":{"ru":"Классика","en":"Classic"},"note":{"ru":"Квады и хенды вперемешку, джек в каждой строке.","en":"Quads and hands mixed, a jack in every row."},"rows":"1234 123 234 1234 134 124 1234 123"},{"name":{"ru":"Квады через джампы","en":"Quads between jumps"},"note":{"ru":"Между квадами только джампы. Чуть легче, но джеки по-прежнему на каждой строке. Игроки зовут это «чордджек 2/4», смотри вариант «2/4: джампы и квады» в чордджеке.","en":"Only jumps between the quads. A bit lighter, but there is still a jack on every row. Players call this a 2/4 chordjack, see the “2/4: jumps and quads” variant of Chordjack."},"rows":"1234 12 1234 34 1234 23 1234 14"},{"name":{"ru":"Квады подряд","en":"Quads back to back"},"note":{"ru":"Два квада подряд, а это уже короткий квадджек, джек на всех четырёх колонках.","en":"Two quads in a row, which is a short quadjack, a jack on all four columns."},"rows":"1234 1234 123 1234 1234 234 1234 124","fam":"jack"},{"name":{"ru":"Внутри хендстрима","en":"Inside handstream"},"note":{"ru":"Квады стоят реже, и между аккордами есть одиночные ноты.","en":"The quads are rarer, and single notes sit between the chords."},"rows":"1234 1 234 3 124 1234 2 134","fam":"handstream"},{"name":{"ru":"Редкие квады","en":"Rare quads"},"note":{"ru":"Квад раз в четыре-пять строк, а между ними обычные хендджеки. Квад не должен выбивать тебя из ритма хендов.","en":"A quad every four or five rows, with plain handjacks between. The quad shouldn't knock you out of the hand rhythm."},"rows":"1234 123 234 134 124 1234 234 123 134 1234"},{"name":{"ru":"Медленный квадхенд","en":"Slow quadhand"},"note":{"ru":"Те же квады и хенды, но на 1/2. Скорость не важна — важно нажимать все ноты аккорда ровно вместе.","en":"The same quads and hands, but at 1/2. Speed doesn't matter here — what matters is pressing every note of the chord together."},"rows":"1234 123 1234 234 1234 124 1234 134","t":[0,2,4,6,8,10,12,14]},{"name":{"ru":"Нарастающая плотность","en":"Thickening chords"},"note":{"ru":"Джамп, хенд, квад — и так три раза. Каждый следующий аккорд добавляет пальцы, а общие колонки всё время повторяются.","en":"Jump, hand, quad — three times over. Each chord adds fingers, and the shared columns keep repeating."},"rows":"12 123 1234 34 234 1234 23 123 1234"},{"name":{"ru":"Опора на четвёртую","en":"Leaning on column 4"},"note":{"ru":"Каждый хенд и квад содержит четвёртую колонку. Правый крайний палец ни разу не отдыхает.","en":"Every hand and quad includes column 4. The right outer finger never gets a break."},"rows":"1234 234 134 1234 124 234 1234 134","hl":[4]},{"name":{"ru":"Затухание в чордджек","en":"Fading into chordjack"},"note":{"ru":"Сначала квады с хендами, потом квады пропадают и остаются только джампы с общими колонками. Руки разгружаются, но джеки не кончаются.","en":"First quads with hands, then the quads drop out and only jumps with shared columns are left. Your hands get lighter but the jacks don't stop."},"rows":"1234 123 1234 234 1234 23 12 13 34 24"}],"also":[{"fam":"handstream","note":{"ru":"Квады попадаются и в хендстриме, но там между ними стоят одиночные ноты.","en":"Quads turn up in handstream too, but there single notes sit between them."}},{"fam":"jack","note":{"ru":"Квады подряд — это квадджек, джек сразу на всех колонках.","en":"Quads in a row are a quadjack, a jack on every column at once."}}],"vs":{"ru":"<b>Квадстрим<\/b> легче по плотности: между квадами там одиночные ноты. В квадхенде между квадами стоят хенды и джампы.","en":"<b>Quadstream<\/b> is less dense: single notes sit between its quads. In quadhand, hands and jumps sit between the quads."},"related":["Quadstream","Quadjack","Handjack","Chordjack"]},{"en":"Quadstream","fam":"chordjack","ru":"Квадстрим","level":3,"skill":["Handstream","Chordjack"],"def":{"ru":"Квад, за ним короткий стрим из одиночных нот, и снова квад.","en":"A quad, a short stream of single notes after it, and a quad again."},"simple":{"ru":"Это стрим, в который время от времени врезается квад, все четыре клавиши разом. Нота сразу после квада всегда стоит на только что нажатой колонке, так что это маленький джек. Ощущается как ровный поток с резкими ударами.","en":"It is a stream that a quad, all four keys at once, cuts into now and then. The note right after a quad always lands on a column you just pressed, so it is a small jack. It feels like a steady flow with sharp hits in it."},"howto":{"ru":["Квад нажимай всей рукой разом и сразу возвращайся в стрим.","Нота после квада — это джек. Отпусти клавиши квада полностью и быстро.","Квады часто стоят на ударах в музыке, так что слушай бит.","Не притормаживай перед квадом, держи ровный темп стрима."],"en":["Press the quad with both hands at once and go straight back to the stream.","The note after the quad is a jack. Release the quad keys fully and quickly.","Quads often sit on the hits in the music, so listen to the beat.","Don't slow down before a quad, keep the stream at an even pace."]},"mistakes":{"ru":["Задерживать квад и опаздывать на следующую ноту.","Нажимать квад не всеми пальцами одновременно.","Сбивать ритм стрима после каждого квада."],"en":["Holding the quad too long and being late for the next note.","Pressing the quad with the fingers at different times.","Breaking the stream rhythm after every quad."]},"practice":{"ru":"Начни на пониженном рейте. Сначала добейся ровного стрима между квадами, потом следи, чтобы квад не ломал ритм. Помогает играть обычный стрим и хендстрим того же темпа.","en":"Start at a lower rate. First get the stream between the quads even, then make sure the quad doesn't break the rhythm. Playing plain stream and handstream at the same tempo helps."},"variants":[{"name":{"ru":"Классика","en":"Classic"},"note":{"ru":"Квад, четыре ноты стрима, снова квад.","en":"A quad, four stream notes, a quad again."},"rows":"1234 2 4 1 3 1234 1 3 2 4 1234 3"},{"name":{"ru":"Редкие квады","en":"Sparse quads"},"note":{"ru":"Между квадами длинный стрим, и квад работает как акцент.","en":"A long stream between the quads, so the quad works as an accent."},"rows":"1234 2 4 1 3 2 4 1 3 1234 2 4","fam":"stream"},{"name":{"ru":"С хендами","en":"With hands"},"note":{"ru":"Между квадами есть джампы и хенды. Это уже плотный хендстрим с квадами.","en":"Jumps and hands sit between the quads. This is dense handstream with quads."},"rows":"1234 2 4 13 2 4 123 1 3 24 1234 1","fam":"handstream"},{"name":{"ru":"Квад после ролла","en":"Quad after a roll"},"note":{"ru":"Квад стоит в конце ролла, когда пальцы только что прошли все колонки по очереди.","en":"The quad comes at the end of a roll, right after the fingers went through every column in turn."},"rows":"1 2 3 4 1234 4 3 2 1 1234 1 2"},{"name":{"ru":"Частые квады","en":"Frequent quads"},"note":{"ru":"Между квадами всего по две одиночные ноты. Почти нет времени отпустить руки перед следующим квадом.","en":"Only two single notes between quads. There's almost no time to relax your hands before the next quad."},"rows":"1234 2 3 1234 1 4 1234 3 2 1234 4 1"},{"name":{"ru":"Трилл между квадами","en":"Trill between quads"},"note":{"ru":"После квада идёт не стрим, а трилл на двух колонках. Руки бьют по очереди, а потом снова все вместе.","en":"After each quad comes a trill on two columns instead of a stream. The hands take turns, then all hit together again."},"rows":"1234 1 3 1 3 1234 2 4 2 4 1234 3 1"},{"name":{"ru":"Быстрые роллы между квадами","en":"Fast rolls between quads"},"note":{"ru":"После квада три ноты роллом на 1/6, потом пауза до следующего квада. Нужно быстро пробежать пальцами и успеть собраться.","en":"After each quad, three notes roll at 1/6, then a pause before the next quad. You need to run your fingers quickly and be ready again."},"rows":"1234 4 3 2 1234 1 2 3 1234 4 3 2","t":[0,1,1.667,2.333,4,5,5.667,6.333,8,9,9.667,10.333]},{"name":{"ru":"Квады в джампстриме","en":"Quads in jumpstream"},"note":{"ru":"Между квадами не одиночные ноты, а джампстрим: джампы через одну ноту. Плотность выше, и квад меньше выделяется.","en":"Between the quads is jumpstream instead of single notes: a jump every other note. It's denser, and the quad stands out less."},"rows":"1234 2 13 4 1 24 3 1234 2 14 3 1 24","fam":"jumpstream"},{"name":{"ru":"Неровные промежутки","en":"Uneven spacing"},"note":{"ru":"Первый квад через три ноты, следующий — через пять. Считать не получится, квады надо читать глазами.","en":"The next quad comes after three notes, the one after that after five. You can't count them, you have to read them."},"rows":"1234 2 4 1 1234 3 1 2 4 3 1234 2"}],"also":[{"fam":"handstream","note":{"ru":"Квадстрим стоит между хендстримом и чордджеком: стрим как в хендстриме, а квад даёт джек.","en":"Quadstream sits between handstream and chordjack: the stream is like handstream, and the quad brings a jack."}},{"fam":"stream","note":{"ru":"Одиночный квад посреди обычного стрима — тот же приём, только реже.","en":"A lone quad in the middle of a plain stream is the same idea, just rarer."}},{"fam":"jumpstream","note":{"ru":"В джампстриме квад иногда стоит на сильной доле вместо джампа, как удар тарелки в музыке.","en":"In jumpstream a quad sometimes takes the place of a jump on a strong beat, like a cymbal hit in the music."}}],"vs":{"ru":"<b>Квадхенд<\/b> плотнее: между квадами там хенды и джампы. В квадстриме между квадами одиночные ноты.","en":"<b>Quadhand<\/b> is denser: hands and jumps sit between its quads. In quadstream, single notes sit between the quads."},"related":["Quadhand","Dense handstream","Handstream","Stream"]},{"en":"Jack","fam":"jack","base":true,"ru":"Джек","level":1,"skill":["JackSpeed"],"def":{"ru":"Одна колонка или один аккорд нажимается несколько раз подряд.","en":"One column or one chord is hit several times in a row."},"simple":{"ru":"Ноты падают в одну и ту же колонку снова и снова. Ты бьёшь одну клавишу одним пальцем несколько раз подряд. Выглядит просто, но на скорости палец быстро устаёт.","en":"Notes fall into the same column again and again. You hit one key with one finger several times in a row. It looks simple, but at speed the finger tires quickly."},"howto":{"ru":["В 4K у каждой колонки свой палец, так что весь джек играет один палец.","После каждого нажатия отпускай клавишу до конца, иначе следующая нота не засчитается.","Поднимай палец ровно настолько, чтобы клавиша отжалась. Большой замах только тратит время.","На быстрых джеках помогай запястьем, чтобы работал не один палец.","Слушай ритм: на джеках легко начать спешить."],"en":["In 4K each column has its own finger, so one finger plays the whole jack.","Release the key fully after every hit, or the next note won't count.","Lift the finger only as far as the key needs to come back up. A big swing just wastes time.","On fast jacks let the wrist help so the finger isn't doing everything alone.","Listen to the rhythm: jacks make it easy to start rushing."]},"mistakes":{"ru":["Не отпускать клавишу полностью между нотами.","Спешить и нажимать раньше нот.","Зажимать палец и всю руку."],"en":["Not releasing the key fully between notes.","Rushing and hitting before the notes arrive.","Tensing the finger and the whole hand."]},"practice":{"ru":"Начни с медленных джеков или рейта ниже 1.0. Сначала нужна ровность: все нажатия на одинаковом расстоянии друг от друга. Потом поднимай скорость небольшими шагами.","en":"Start with slow jacks or a rate below 1.0. Evenness comes first: every hit the same distance apart. Then raise the speed in small steps."},"variants":[{"name":{"ru":"Классика","en":"Classic"},"note":{"ru":"Сначала одна колонка четыре раза подряд, потом джамп три раза и снова одиночная нота три раза.","en":"First one column four times in a row, then a jump three times, then a single note three times."},"rows":"1 1 1 1 23 23 23 4 4 4"},{"name":{"ru":"По четыре на ноту","en":"Four per note"},"note":{"ru":"Одиночные ноты по четыре подряд. Чистая проверка одного пальца.","en":"Single notes four times each. A pure test of one finger."},"rows":"1 1 1 1 3 3 3 3 2 2 2 2"},{"name":{"ru":"Внутри чордджека","en":"Inside chordjack"},"note":{"ru":"Джек прячется в аккордах: одна колонка повторяется, а другие меняются.","en":"The jack hides inside chords: one column repeats while the others change."},"rows":"12 123 23 234 34 134 14 124","fam":"chordjack"},{"name":{"ru":"Внутри стрима","en":"Inside stream"},"note":{"ru":"Нота повторяется посреди потока. Так выглядят джеки в стриме.","en":"A note repeats in the middle of the flow. That is what a jacky stream looks like."},"rows":"1 3 3 2 4 1 1 3 2 4 4 1","fam":"stream"},{"name":{"ru":"Неровный ритм","en":"Uneven rhythm"},"note":{"ru":"Джеки разной скорости: сначала на 1/6, потом на 1/8. Считать ноты здесь труднее.","en":"Jacks at different speeds: first at 1/6, then at 1/8. Counting the notes is harder here."},"rows":"1 1 3 3 3 2 4 4","t":[0,0.667,2,2.667,3.333,4,5,5.5],"fam":"tech"},{"name":{"ru":"На средних колонках","en":"On the inner columns"},"note":{"ru":"Тройные джеки только на 2 и 3. Работают пальцы ближе к центру, и каждая рука бьёт свою серию.","en":"Triple jacks only on columns 2 and 3. The fingers closest to the middle do the work, each hand taking its own run."},"rows":"2 2 2 3 3 3 2 2 2 3 3 3"},{"name":{"ru":"Ускоряющийся джек","en":"Speeding-up jack"},"note":{"ru":"Одна колонка: сначала на 1/2, потом на 1/4. Палец должен ускориться без зажима.","en":"One column: first at 1/2, then at 1/4. Your finger has to speed up without tensing."},"rows":"4 4 4 4 4 4 4 4 4 4","t":[0,2,4,6,8,9,10,11,12,13],"hl":[4]},{"name":{"ru":"Джек на 1/3","en":"Jack at 1/3"},"note":{"ru":"Три ноты на колонку в ритме триолей (1/3). Это чуть медленнее, чем 1/4, но счёт идёт на три, а не на четыре.","en":"Three notes per column in a triplet rhythm (1/3). It's a bit slower than 1/4, but you count in threes, not fours."},"rows":"3 3 3 1 1 1 3 3 3","t":[0,1.333,2.667,4,5.333,6.667,8,9.333,10.667]},{"name":{"ru":"Джек переходит в трилл","en":"Jack into a trill"},"note":{"ru":"Сначала четыре удара по первой колонке, потом каждую вторую ноту забирает третья. Один палец превращается в две руки по очереди.","en":"First four hits on column 1, then column 3 takes every other note. One finger turns into two hands taking turns."},"rows":"1 1 1 1 3 1 3 1 3 1","hl":[1]},{"name":{"ru":"Пары с паузами","en":"Spaced-out pairs"},"note":{"ru":"По две ноты на колонку, а между парами пауза. Самая спокойная форма джека для начала.","en":"Two notes per column with a rest between the pairs. The calmest form of jack to start with."},"rows":"3 3 1 1 4 4 2 2","t":[0,1,4,5,8,9,12,13]}],"also":[{"fam":"chordjack","note":{"ru":"В чордджеке джеки идут внутри аккордов.","en":"In chordjack, the jacks sit inside the chords."}},{"fam":"stream","note":{"ru":"Повтор ноты в стриме даёт джеки в стриме.","en":"A repeated note in a stream makes a jacky stream."}},{"fam":"tech","note":{"ru":"В техе джеки идут в неровном ритме, и их труднее считать.","en":"In tech, jacks come in uneven rhythm and are harder to count."}}],"vs":{"ru":"<b>Анкор<\/b> тоже нагружает одну колонку, но между её нотами стоят ноты на других колонках. В джеке колонка повторяется подряд, строка за строкой.","en":"An <b>anchor<\/b> also loads one column, but notes on other columns sit between its notes. In a jack the column repeats back to back, row after row."},"related":["Minijacks","Longjacks","Speedjacks","Chordjack","Anchor"]},{"en":"Minijacks","fam":"jack","ru":"Миниджеки","level":1,"skill":["JackSpeed"],"def":{"ru":"Короткий джек: нота или джамп ровно два раза подряд, потом сдвиг.","en":"A short jack: a note or jump exactly twice in a row, then it moves."},"simple":{"ru":"Нота повторяется ровно дважды, «тук-тук», и дальше идёт другая колонка. Это самый короткий джек. Он встречается почти в каждой карте.","en":"A note repeats exactly twice, knock-knock, and then another column comes. It is the shortest jack there is. You'll find it in almost every map."},"howto":{"ru":["Вторую ноту бей тем же пальцем, сразу отпустив клавишу после первой.","Замечай пары одинаковых нот заранее, чтобы не сыграть их как стрим.","Не ускоряйся на второй ноте: обе стоят ровно по ритму.","После миниджека сразу продолжай поток, не останавливайся."],"en":["Hit the second note with the same finger, releasing the key right after the first.","Spot pairs of matching notes early so you don't play them like stream.","Don't speed up on the second note: both sit right on the rhythm.","After the minijack, keep the flow going without stopping."]},"mistakes":{"ru":["Пропустить вторую ноту, потому что клавиша не успела отжаться.","Нажать вторую ноту слишком рано, потому что пальцы привыкли к стриму."],"en":["Missing the second note because the key didn't come back up in time.","Hitting the second note too early because the fingers are used to stream."]},"practice":{"ru":"Играй стримы с миниджеками на рейте 0.8–0.9. Следи, чтобы вторая нота пары не уезжала по таймингу. Когда всё ровно, поднимай рейт.","en":"Play streams with minijacks at 0.8–0.9 rate. Make sure the second note of each pair doesn't drift off time. When it is even, raise the rate."},"variants":[{"name":{"ru":"Классика","en":"Classic"},"note":{"ru":"Ноты и джампы по два раза, между ними одиночные ноты.","en":"Notes and jumps twice each, with single notes between them."},"rows":"12 12 3 4 23 23 1 4 34 34 1 2"},{"name":{"ru":"В стриме","en":"In stream"},"note":{"ru":"Одиночная нота стоит дважды подряд посреди потока.","en":"A single note sits twice in a row in the middle of the flow."},"rows":"1 3 3 2 4 1 1 2 4 3 3 1","fam":"stream"},{"name":{"ru":"В джампстриме","en":"In jumpstream"},"note":{"ru":"Нота или джамп дважды посреди джампстрима.","en":"A note or jump twice in the middle of jumpstream."},"rows":"12 12 3 24 1 34 34 2 13 4 4 12","fam":"jumpstream"},{"name":{"ru":"В чордджеке","en":"In chordjack"},"note":{"ru":"Колонки переходят из аккорда в аккорд, и почти каждая нота звучит два раза.","en":"Columns carry over from chord to chord, so almost every note sounds twice."},"rows":"123 13 134 34 234 24 124 12","fam":"chordjack"},{"name":{"ru":"Быстрее ритма","en":"Faster than the rhythm"},"note":{"ru":"Стрим на 1/4, а миниджеки в нём на 1/6 или 1/8, то есть быстрее остальных нот.","en":"The stream is at 1/4, but its minijacks are at 1/6 or 1/8, faster than the other notes."},"rows":"1 3 2 2 4 1 3 3 2 4","t":[0,1,2,2.667,4,5,6,6.5,8,9],"fam":"tech"},{"name":{"ru":"На развороте ролла","en":"At the turn of a roll"},"note":{"ru":"Ролл идёт вверх и вниз, а крайняя нота на развороте звучит дважды. Палец на краю бьёт два раза подряд, пока ролл меняет направление.","en":"The roll goes up and down, and the edge note at each turn is played twice. The edge finger hits twice in a row as the roll changes direction."},"rows":"1 2 3 4 4 3 2 1 1 2 3 4 4 3","fam":"stream"},{"name":{"ru":"В трилле","en":"In a trill"},"note":{"ru":"Трилл на 1 и 3, но иногда одна нота повторяется, и порядок рук меняется. После миниджека не начни бить старой рукой.","en":"A trill on 1 and 3, but now and then a note repeats and the hand order flips. After the minijack, don't start with the old hand."},"rows":"1 3 1 3 3 1 3 1 1 3 1 3"},{"name":{"ru":"Всё время на второй","en":"Always on column 2"},"note":{"ru":"Двойная нота всегда на второй колонке, а между ними обычный стрим. Один и тот же палец получает все повторы и устаёт.","en":"The double note is always on column 2, with plain stream between. The same finger gets every repeat and tires out."},"rows":"2 2 4 1 3 2 2 4 1 3 2 2","hl":[2]},{"name":{"ru":"Цепочка миниджеков","en":"Chain of minijacks"},"note":{"ru":"Каждая нота звучит дважды, и так подряд. Это уже не стрим: каждый палец по очереди делает двойной удар.","en":"Every note is played twice, one after another. It's no longer a stream: each finger takes its turn doing a double hit."},"rows":"1 1 3 3 2 2 4 4 1 1 3 3"},{"name":{"ru":"В джамптрилле","en":"In a jumptrill"},"note":{"ru":"Джампы [12] и [34] чередуются, но иногда один джамп повторяется. Нужно вовремя это заметить и ударить ещё раз той же рукой.","en":"The jumps [12] and [34] alternate, but sometimes one jump repeats. You have to notice it and hit again with the same hand."},"rows":"12 34 34 12 34 12 12 34 12 34","fam":"jumpstream"}],"also":[{"fam":"stream","note":{"ru":"В стриме миниджеки дают джеки в стриме.","en":"In stream, minijacks make a jacky stream."}},{"fam":"jumpstream","note":{"ru":"В джампстриме миниджек — нота или джамп дважды посреди потока.","en":"In jumpstream, a minijack is a note or jump twice in the middle of the flow."}},{"fam":"handstream","note":{"ru":"В хендстриме это нота или джамп между хендами, который повторяет колонку.","en":"In handstream, it is a note or jump between the hands that repeats a column."}},{"fam":"chordjack","note":{"ru":"В чордджеке миниджеки на каждом шагу: колонки повторяются из аккорда в аккорд.","en":"In chordjack, minijacks are everywhere: columns repeat from chord to chord."}},{"fam":"tech","note":{"ru":"В техе миниджеки часто прячутся в неровном ритме.","en":"In tech, minijacks often hide in an uneven rhythm."}}],"vs":{"ru":"<b>Лонгджек<\/b> держит колонку много строк подряд, миниджек — только две.","en":"A <b>longjack<\/b> holds a column for many rows in a row; a minijack only two."},"related":["Jacky stream","Jumpjack","Longjacks","Jack","Speedjacks"]},{"en":"Longjacks","fam":"jack","ru":"Лонгджеки","level":2,"skill":["JackSpeed","Stamina"],"def":{"ru":"Одна колонка нажимается много строк подряд, а вокруг неё могут меняться другие ноты.","en":"One column is hit for many rows in a row, while other notes around it may change."},"simple":{"ru":"Один палец долго бьёт одну и ту же клавишу, строка за строкой. Остальные пальцы что-то добавляют, а этот всё стучит. Главная трудность в том, что палец устаёт, а ритм терять нельзя.","en":"One finger keeps hitting the same key, row after row. The other fingers add notes around it while this one keeps knocking. The hard part is that the finger tires and the rhythm still has to hold."},"howto":{"ru":["Расслабь палец, который держит джек. Зажатый палец устанет за пару секунд.","Помогай запястьем, чтобы не всё делал один палец.","Ритм держи по колонке с джеком, остальные ноты просто добавляй к нему.","Не считай каждую ноту, держи ровный темп под музыку."],"en":["Relax the finger that holds the jack. A tense finger tires within a couple of seconds.","Let the wrist help so one finger isn't doing everything.","Keep time with the jack column and simply add the other notes to it.","Don't count every note, keep an even pace with the music."]},"mistakes":{"ru":["Ускоряться к концу джека и обгонять ноты.","Зажимать всю руку, из-за чего остальные ноты тоже начинают мазать.","Сбиваться, когда рядом с джеком меняются другие ноты."],"en":["Speeding up toward the end of the jack and getting ahead of the notes.","Tensing the whole hand, so the other notes start to miss too.","Losing the jack when the notes next to it change."]},"practice":{"ru":"Начни с длинных джеков на одной ноте на низком рейте. Добейся ровности от первой ноты до последней. Потом добавляй ноты вокруг и поднимай рейт.","en":"Start with long single-note jacks at a low rate. Get them even from the first note to the last. Then add notes around them and raise the rate."},"variants":[{"name":{"ru":"Классика","en":"Classic"},"note":{"ru":"Колонка 1 в каждой строке, а вокруг неё меняются ноты на других колонках.","en":"Column 1 in every row, with the notes on the other columns changing around it."},"rows":"12 1 13 12 14 1 13 12 1 14","hl":[1]},{"name":{"ru":"Чистый лонгджек","en":"Bare longjack"},"note":{"ru":"Одна колонка без других нот. Проверка выносливости одного пальца.","en":"One column and nothing else. A stamina test for one finger."},"rows":"3 3 3 3 3 3 3 3 3 3","hl":[3]},{"name":{"ru":"На правой руке","en":"On the right hand"},"note":{"ru":"Тот же приём на колонке 4: джек держит правый средний палец.","en":"The same idea on column 4: the right middle finger holds the jack."},"rows":"34 4 24 4 14 34 4 24","hl":[4]},{"name":{"ru":"В чордджеке","en":"In chordjack"},"note":{"ru":"Колонка 1 есть в каждом аккорде подряд.","en":"Column 1 is in every chord in a row."},"rows":"12 13 124 1 134 12 13 123","hl":[1],"fam":"chordjack"},{"name":{"ru":"Под стримом","en":"Under a stream"},"note":{"ru":"Левая рука держит колонку 1, а правая чередует колонки 3 и 4 поверх неё.","en":"The left hand holds column 1 while the right hand alternates columns 3 and 4 over it."},"rows":"1 13 1 14 1 13 1 14 1 13","hl":[1],"fam":"stream"},{"name":{"ru":"На второй колонке","en":"On column 2"},"note":{"ru":"Вторая колонка бьётся в каждой строке, а через раз к ней добавляется джамп с соседней нотой. Внутренний палец держит весь джек.","en":"Column 2 is hit in every row, and every other row adds a jump with a neighbour. An inner finger carries the whole jack."},"rows":"2 12 2 23 2 24 2 12 2 23","hl":[2]},{"name":{"ru":"Смена колонки","en":"Switching columns"},"note":{"ru":"Шесть ударов по первой колонке, потом шесть по четвёртой. Новый палец вступает «холодным», и первые ноты легко смазать.","en":"Six hits on column 1, then six on column 4. The new finger starts cold, so the first notes are easy to smear."},"rows":"1 1 1 1 1 1 4 4 4 4 4 4"},{"name":{"ru":"С паузой в середине","en":"With a gap in the middle"},"note":{"ru":"Джек на первой колонке прерывается паузой, а потом продолжается. Держи ритм в голове и начни снова ровно.","en":"The jack on column 1 stops for a rest, then carries on. Keep the beat in your head and restart evenly."},"rows":"1 12 1 13 1 1 14 1 12 1","t":[0,1,2,3,4,8,9,10,11,12],"hl":[1]},{"name":{"ru":"Под триллом","en":"Under a trill"},"note":{"ru":"Четвёртая колонка бьётся в каждой строке, а левая рука в это время играет трилл на 1 и 2. Руки делают разное, и их нельзя путать.","en":"Column 4 is hit in every row while the left hand plays a trill on 1 and 2. The hands do different things, and you mustn't mix them up."},"rows":"14 24 14 24 14 24 14 24 14 24","hl":[4]},{"name":{"ru":"В хендстриме","en":"In handstream"},"note":{"ru":"Хенды, джампы и одиночные ноты меняются, но первая колонка есть в каждой строке. Левый крайний палец не отдыхает даже на стриме.","en":"Hands, jumps and single notes change, but column 1 is in every row. The left outer finger gets no rest even in the stream parts."},"rows":"134 1 12 124 1 13 123 1 14 134","fam":"handstream","hl":[1]}],"also":[{"fam":"chordjack","note":{"ru":"В чордджеке лонгджек — колонка, которая есть в каждом аккорде подряд.","en":"In chordjack, a longjack is a column present in every chord in a row."}},{"fam":"stream","note":{"ru":"Колонка держится, а другая рука играет свой стрим поверх неё.","en":"One column holds while the other hand plays its own stream over it."}},{"fam":"jumpstream","note":{"ru":"Если анкор в джампстриме стоит на колонке строка за строкой, он становится лонгджеком.","en":"When an anchor in jumpstream hits its column row after row, it becomes a longjack."}},{"fam":"handstream","note":{"ru":"В хендстриме лонгджек — это колонка, которая есть почти в каждом хенде и джампе подряд. Он делает хендстрим заметно тяжелее.","en":"In handstream a longjack is one column that shows up in nearly every hand and jump in a row. It makes the handstream much heavier."}}],"vs":{"ru":"<b>Анкор<\/b> тоже нагружает одну колонку, но между её нотами есть ноты на других колонках. Лонгджек идёт подряд, строка за строкой.","en":"An <b>anchor<\/b> also loads one column, but notes on other columns come between its notes. A longjack goes back to back, row after row."},"related":["Anchor","Minijacks","Jack","Stamina"]},{"en":"Gluts","fam":"chordjack","ru":"Глюты","level":2,"skill":["Chordjack","JackSpeed"],"def":{"ru":"Джампы сдвигаются на одну колонку, и каждый новый делит ноту с прошлым: [12][23][34].","en":"Jumps slide over by one column, each new one sharing a note with the last: [12][23][34]."},"simple":{"ru":"Джамп как будто ползёт по клавиатуре. Одна нота джампа остаётся на месте, вторая шагает дальше. Поэтому каждая общая нота — это короткий джек.","en":"The jump seems to crawl across the keys. One note of the jump stays put while the other steps on. That makes every shared note a short jack."},"howto":{"ru":["Смотри на общую ноту: она повторяется, а вторая нота переезжает.","[23] играют два указательных пальца, а [12] и [34] играет одна рука.","Отпускай общую клавишу полностью, это такой же джек.","Держи ровный ритм и не беги вперёд, когда джампы едут в одну сторону."],"en":["Watch the shared note: it repeats while the other note moves over.","[23] is played by both index fingers, while [12] and [34] are each played by one hand.","Release the shared key fully, it is a jack like any other.","Keep an even rhythm and don't rush when the jumps run in one direction."]},"mistakes":{"ru":["Путать направление и нажимать не тот джамп.","Терять общую ноту, потому что палец не отпустил клавишу."],"en":["Mixing up the direction and pressing the wrong jump.","Losing the shared note because the finger didn't release the key."]},"practice":{"ru":"Медленно сыграй глюты в обе стороны, туда и обратно. Когда руки запомнят форму, поднимай рейт. Следи, чтобы общая нота звучала так же чётко, как новая.","en":"Play gluts slowly in both directions, there and back. Once your hands know the shape, raise the rate. Make sure the shared note sounds as clean as the new one."},"variants":[{"name":{"ru":"Классика","en":"Classic"},"note":{"ru":"Джамп ползёт вправо и обратно, каждый раз сдвигаясь на одну колонку.","en":"The jump crawls right and back, one column at a time."},"rows":"12 23 34 23 12 23 34 23 12"},{"name":{"ru":"С повторами","en":"With repeats"},"note":{"ru":"Крайние джампы звучат дважды. Здесь глюты смешиваются с джампджеками.","en":"The outer jumps sound twice. Here gluts blend into jumpjacks."},"rows":"12 12 23 34 34 23 12 12 23 34"},{"name":{"ru":"В одну сторону","en":"One direction"},"note":{"ru":"Джампы всё в
